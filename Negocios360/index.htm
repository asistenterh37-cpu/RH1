<style>

:root{
  --g:#0f8b4c;
  --gd:#08713d;
  --gs:#eaf8f0;

  --bg:#f5f7f6;
  --white:#ffffff;

  --tx:#17202a;
  --mut:#6b7280;

  --ln:#dfe6e2;

  --red:#b42318;
  --yellow:#d97706;

  --dark:#202723;
  --dark2:#151a17;

  --shadow:0 12px 34px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  background:
    var(--bg);

  color:
    var(--tx);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}


/* ============================================================
   CONTENEDOR
   ============================================================ */

.app{

  width:
    min(
      1100px,
      calc(100% - 24px)
    );

  margin:
    0 auto;

  padding:
    18px 0 50px;

}


/* ============================================================
   CABECERA
   ============================================================ */

.hero{

  padding:
    20px;

  border:
    1px solid
    #e5ebe7;

  border-radius:
    22px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #edf9f2
    );

  box-shadow:
    var(--shadow);

  margin-bottom:
    16px;

}


.hero-top{

  display:flex;

  align-items:center;

  gap:
    14px;

}


.logo{

  width:
    55px;

  height:
    55px;

  border-radius:
    16px;

  display:grid;

  place-items:center;

  flex:
    0 0 auto;

  background:
    var(--g);

  color:
    #fff;

  font-size:
    27px;

}


.hero h1{

  margin:
    0;

  color:
    var(--gd);

  font-size:
    clamp(
      25px,
      4vw,
      38px
    );

  line-height:
    1.05;

}


.hero p{

  margin:
    6px 0 0;

  color:
    var(--mut);

  font-size:
    14px;

}


/* ============================================================
   PANEL
   ============================================================ */

.panel{

  background:
    #fff;

  border:
    1px solid
    #e5ebe7;

  border-radius:
    20px;

  padding:
    18px;

  box-shadow:
    var(--shadow);

  margin-bottom:
    16px;

}


/* ============================================================
   NEGOCIO
   ============================================================ */

.business-row{

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto;

  gap:
    12px;

  align-items:end;

}


.field label{

  display:block;

  margin-bottom:
    6px;

  font-size:
    12px;

  font-weight:
    900;

  color:
    var(--mut);

  text-transform:
    uppercase;

}


.field select,
.field input{

  width:
    100%;

  min-height:
    46px;

  padding:
    10px 12px;

  background:
    #fff;

  border:
    1px solid
    var(--ln);

  border-radius:
    12px;

  outline:
    none;

}


.field select:focus,
.field input:focus{

  border-color:
    #84cba7;

  box-shadow:
    0 0 0 4px
    rgba(
      15,
      139,
      76,
      .08
    );

}


/* ============================================================
   PANTALLA CAJA
   ============================================================ */

.cash-screen{

  min-height:
    310px;

  max-height:
    410px;

  display:flex;

  flex-direction:
    column;

  padding:
    15px;

  border-radius:
    18px;

  background:
    var(--dark);

  color:
    #eef7f1;

  box-shadow:
    inset
    0 0 0 1px
    rgba(255,255,255,.05),
    inset
    0 10px 30px
    rgba(0,0,0,.22);

}


.screen-head{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:
    10px;

  padding-bottom:
    10px;

  border-bottom:
    1px solid
    rgba(255,255,255,.14);

  flex:
    0 0 auto;

}


.screen-head span{

  font-size:
    12px;

  font-weight:
    900;

  color:
    #8df0b7;

  letter-spacing:
    .8px;

}


.receipt{

  flex:
    1 1 auto;

  min-height:
    180px;

  overflow-y:
    auto;

  padding:
    12px 0;

}


.empty-receipt{

  min-height:
    180px;

  display:grid;

  place-items:center;

  text-align:center;

  color:
    #91a198;

  font-size:
    13px;

}


.receipt-line{

  margin-bottom:
    5px;

  border-radius:
    9px;

  overflow:hidden;

}


.receipt-main{

  width:
    100%;

  display:grid;

  grid-template-columns:
    45px
    minmax(0,1fr)
    auto;

  gap:
    7px;

  align-items:center;

  padding:
    7px;

  border:
    0;

  border-radius:
    9px;

  background:
    transparent;

  color:
    inherit;

  text-align:left;

}


.receipt-main:hover{

  background:
    rgba(
      255,
      255,
      255,
      .06
    );

}


.receipt-line.editing
.receipt-main{

  background:
    rgba(
      141,
      240,
      183,
      .09
    );

}


.line-qty{

  font-weight:
    900;

  color:
    #8df0b7;

}


.line-name{

  overflow:hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;

}


.line-total{

  font-weight:
    900;

  text-align:right;

  white-space:
    nowrap;

}


.line-editor{

  display:grid;

  grid-template-columns:
    42px
    50px
    42px
    42px;

  justify-content:end;

  gap:
    6px;

  padding:
    6px 7px 9px;

}


.line-editor button{

  height:
    36px;

  border:
    0;

  border-radius:
    8px;

  background:
    #39423d;

  color:
    #fff;

  font-weight:
    900;

}


.line-editor button:hover{

  background:
    #48534d;

}


.line-editor button.delete{

  background:
    #69261f;

}


.line-editor button:disabled{

  opacity:
    .35;

  cursor:
    not-allowed;

}


.line-count{

  display:grid;

  place-items:center;

  font-weight:
    900;

  color:
    #8df0b7;

}


.screen-foot{

  display:flex;

  justify-content:
    space-between;

  align-items:flex-end;

  gap:
    12px;

  padding-top:
    12px;

  border-top:
    1px solid
    rgba(255,255,255,.14);

  flex:
    0 0 auto;

}


.screen-state{

  font-size:
    12px;

  color:
    #aebbb4;

}


.screen-total{

  font-size:
    clamp(
      24px,
      5vw,
      34px

  color:
    #8df0b7;

  font-weight:
    950;

  white-space:
    nowrap;

}


/* ============================================================
   OPERACIONES
   ============================================================ */

.operations{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:
    10px;

  margin-top:
    12px;

}


.op{

  min-height:
    48px;

  border:
    0;

  border-radius:
    13px;

  font-size:
    20px;

  font-weight:
    950;

}


.op.clear{

  color:
    var(--red);

  background:
    #fff1ef;

}


.op.equal{

  color:
    #fff;

  background:
    var(--g);

}


.op.equal:hover{

  background:
    var(--gd);

}


/* ============================================================
   CATEGORIAS
   ============================================================ */

  justify-content:
    space-between;

  gap:
    10px;

  align-items:center;

  margin-bottom:
    10px;

}


.section-title h2{

  margin:
    0;

  font-size:
    18px;

}


.section-title small{

  color:
    var(--mut);

}


.category-bar{

  display:flex;

  gap:
    8px;

  overflow-x:
    auto;

  padding:

    thin;

}


.category-btn{

  border:
    1px solid
    var(--ln);

  background:
    #fff;

  color:
    var(--tx);

  border-radius:
    999px;

  padding:
    9px 14px;

  font-weight:
    850;

  white-space:
    nowrap;

}


.category-btn.on{

  background:
    var(--g);

  border-color:
    var(--g);

  color:
    #fff;

}


/* ============================================================
   BUSQUEDA
   ============================================================ */

.search-box{

  margin-top:
    10px;

}


.search-box input{

  width:
    100%;

  height:
    44px;

  border:
    1px solid
    var(--ln);

  border-radius:
    12px;

  padding:
    10px 13px;

  outline:
    none;

}


.search-box input:focus{

  border-color:
    #84cba7;

  box-shadow:
    0 0 0 4px
    rgba(
      15,
      139,
      76,
      .08
    );

}


/* ============================================================
   ITEMS
   ============================================================ */

.items-grid{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:
    10px;

  margin-top:
    13px;

}


.item-btn{

  min-height:
    104px;

  display:flex;

  flex-direction:
    column;

  justify-content:
    space-between;

  gap:
    8px;

  padding:
    13px;

  border:
    1px solid
    #dfe6e2;

  border-radius:
    15px;

  background:
    #fff;

  text-align:left;

  color:
    var(--tx);

  box-shadow:
    0 4px 13px
    rgba(
      0,
      0,
      0,
      .035
    );

}


.item-btn:hover{

  border-color:
    #8ccbab;

  transform:
    translateY(-1px);

}


.item-btn.selected{

  background:
    var(--gs);

  border-color:
    #8bc9a9;

}


.item-name{

  font-weight:
    900;

  line-height:
    1.2;

}


.item-bottom{

  display:flex;

  justify-content:
    space-between;

  align-items:end;

  gap:
    8px;

}


.item-price{

  color:
    var(--gd);

  font-size:
    18px;

  font-weight:
    950;

}


.item-count{

  min-width:
    26px;

  height:
    26px;

  display:grid;

  place-items:center;

  padding:
    0 6px;

  border-radius:
    999px;

  background:
    var(--g);

  color:
    white;

  font-size:
    11px;

  font-weight:
    900;

}


/* ============================================================
   ESTADO
   ============================================================ */

.status{

  min-height:
    24px;

  margin-top:
    10px;

  color:
    var(--mut);

  font-size:
    13px;

}


.status.error{

  color:
    var(--red);

}


/* ============================================================
   CARGANDO
   ============================================================ */

.loader{

  grid-column:
    1 / -1;

  padding:
    30px;

  border:
    1px dashed
    #ccd7d0;

  border-radius:
    15px;

  background:
    #fff;

  text-align:center;

  color:
    var(--mut);

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media(max-width:800px){

  .items-grid{

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

  }

}


@media(max-width:560px){

  .app{

    width:
      100%;

    padding:
      0 10px 30px;

  }


  .hero{

    margin:
      0 -10px 12px;

    border-radius:
      0 0 22px 22px;

  }

    padding:
      13px;

  }


  .business-row{

  }


  .cash-screen{

      285px;

  }


  .items-grid{

      7px;

  }


  .item-btn{

    min-height:
      94px;

    padding:
      10px;

  }


  .item-name{

    font-size:
      14px;

  }


  .item-price{

    font-size:
      16px;

  }

}

</style>
</head>

<style>

<script>

/*
 * Este script se encuentra antes de los scripts principales.
 *
 * Esperamos a DOMContentLoaded para modificar las funciones
 * después de que todo el sistema haya sido cargado.
 */

window.addEventListener(
  'DOMContentLoaded',
  function(){


    /* ========================================================
       MODIFICAR LISTA DE MODOS
       ======================================================== */

    if(
      typeof MODE_INFO ===
      'undefined'
    ){

      return;

    }


    /*
     * Inventario ya NO será un modo principal.
     */

    delete MODE_INFO.inventory;


    /*
     * Ahora Inventario vive dentro de Reportes.
     */

    MODE_INFO.reports = {

      label:
        '📊 Modo Reportes',

      color:
        '#166534',

      text:
        'Modo Reportes activo. Selecciona el reporte que deseas consultar.'

    };


    /* ========================================================
       REFERENCIAS A FUNCIONES ORIGINALES
       ======================================================== */

    const originalRenderItems =
      renderItems;


    const originalRenderReceipt =
      renderReceipt;


    const originalUpdateOperationButtons =
      updateOperationButtons;


    /* ========================================================
       GUARDAR ESTADO VISUAL DEL MENU
       ======================================================== */

    let categoryTitleOriginal =
      'Categorías';


    let categoryInfoOriginal =
      '';


    function getProductPanel(){

      const grid =
        document.getElementById(
          'itemsGrid'
        );


      return grid
        ?
        grid.closest(
          'section.panel'
        )
        :
        null;

    }


    function rememberProductMenu(){

      const panel =
        getProductPanel();


      if(
        !panel
      ){

        return;

      }


      const title =
        panel.querySelector(
          '.section-title h2'
        );


      const info =
        document.getElementById(
          'categoryInfo'
        );


      if(
        title
        &&
        title.textContent.trim()
      ){

        categoryTitleOriginal =

/* ============================================================
   JSONP
   Evita problemas CORS entre GitHub y Apps Script.
   ============================================================ */

function jsonp(
  action,
  params = {},
  timeoutMs = 15000
){

  assertConfigured();


  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callback =
        'cajaCallback_'
        +
        Date.now()
        +
        '_'
        +
        Math.random()
          .toString(36)
          .slice(2);


      const url =
        new URL(
          CONFIG.GAS_WEB_APP_URL
        );


      url.searchParams.set(
        'action',
        action
      );


      url.searchParams.set(
        'callback',
        callback
      );


      url.searchParams.set(
        '_',
        Date.now()
      );


      Object
        .entries(
          params
        )
        .forEach(
          ([key,value]) => {

            if(
              value !==
              undefined
              &&
              value !==
              null
            ){

              url
                .searchParams
                .set(
                  key,
                  value
                );

            }

          }
        );


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'Tiempo de espera agotado al conectar con Apps Script.'
              )
            );

          },
          timeoutMs
        );


      function cleanup(){

        if(
          finished
        ){
          return;
        }


        finished =
          true;


        clearTimeout(
          timer
        );


        try{

          delete window[
            callback
          ];

        }
        catch(_){
        }


        script.remove();

      }


      window[
        callback
      ] =
        data => {

          if(
            finished
          ){
            return;
          }


          const result =
            data;


          cleanup();

          resolve(
            result
          );

        };


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              'No fue posible comunicarse con Apps Script.'
            )
          );

        };


      script.src =
        url.toString();


      document
        .head
        .appendChild(
          script
        );

    }
  );

}

function renderCategories(){

  const categories =
    getCategories();


  if(
    !categories.includes(
      currentCategory
    )
  ){

    currentCategory =
      categories[0]
      ||
      '';

  }


  const bar =
    document.getElementById(
      'categoryBar'
    );


  bar.innerHTML =
    categories
      .map(
        category =>
          `
          <button
            type="button"
            class="
              category-btn
              ${
                category ===
                currentCategory
                ?
                'on'
                :
                ''
              }
            "
            data-category="${escapeAttr(category)}"
          >
            ${escapeHtml(category)}
          </button>
          `
      )
      .join('');


  bar
    .querySelectorAll(
      '[data-category]'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            currentCategory =
              button.dataset.category;


            renderCategories();

          }
        );

      }
    );


  document
    .getElementById(
      'categoryInfo'
    )
    .textContent =
      categories.length
      +
      (
        categories.length ===
        1
        ?
        ' categoría'
        :
        ' categorías'
      );


  renderItems();

}

let appMode =
  'sales';

let changingPrice =
  false;


/* ============================================================
   BOTON MODO
   ============================================================ */

function ensureModeButton(){

  let button =
    document.getElementById(
      'modeButton'
    );


  if(button){

    updateModeButton();

    return;

  }


  const businessSelect =
    document.getElementById(
      'businessSelect'
    );


  if(
    !businessSelect
  ){
    return;
  }


  const row =
    businessSelect.closest(
      '.business-row'
    );


  if(
    !row
  ){
    return;
  }


  /*
   * El último DIV es donde actualmente
   * está el botón Actualizar.
   */

  const actions =
    row.lastElementChild;


  if(
    !actions
  ){
    return;
  }


  actions.style.display =
    'flex';

  actions.style.gap =
    '8px';

  actions.style.flexWrap =
    'wrap';


  button =
    document.createElement(
      'button'
    );


  button.type =
    'button';

  button.id =
    'modeButton';

  button.className =
    'category-btn on';


  button.style.minHeight =
    '46px';

  button.style.padding =
    '0 16px';

  button.style.fontSize =
    '14px';

  button.style.fontWeight =
    '900';


  button.addEventListener(
    'click',
    toggleMode
  );


  actions.insertBefore(
    button,
    actions.firstChild
  );


  updateModeButton();

}



/* ============================================================
   ACTUALIZAR APARIENCIA BOTON MODO
   ============================================================ */

function updateModeButton(){

  const button =
    document.getElementById(
      'modeButton'
    );


  if(
    !button
  ){
    return;
  }


  if(
    appMode ===
    'prices'
  ){

    button.textContent =
      '🏷️ Modo Precios';

    button.style.background =
      '#d97706';

    button.style.borderColor =
      '#d97706';

    button.style.color =
      '#ffffff';

    button.title =
      'Toca para regresar a Modo Ventas';

  }

  else{

    button.textContent =
      '🛒 Modo Ventas';

    button.style.background =
      'var(--g)';

    button.style.borderColor =
      'var(--g)';

    button.style.color =
      '#ffffff';

    button.title =
      'Toca para cambiar a Modo Precios';

  }

}



/* ============================================================
   CAMBIAR MODO
   ============================================================ */

function toggleMode(){

  if(
    changingPrice
  ){
    return;
  }


  if(
    appMode ===
    'sales'
  ){

    appMode =
      'prices';

  }

  else{

    appMode =
      'sales';

  }


  updateModeButton();


  /*
   * En modo precios deshabilitamos
   * C y = para evitar operaciones
   * accidentales.
   */

  document
    .querySelectorAll(
      '.operations button'
    )
    .forEach(
      button => {

        const disabled =
          appMode ===
          'prices';


        button.disabled =
          disabled;


        button.style.opacity =
          disabled
          ?
          '.45'
          :
          '1';


        button.style.cursor =
          disabled
          ?
          'not-allowed'
          :
          'pointer';

      }
    );


  renderItems();


  if(
    appMode ===
    'prices'
  ){

    setStatus(
      'Modo Precios activo. Toca un ítem para modificar su precio.'
    );

  }

  else{

    setStatus(
      'Modo Ventas activo.'
    );

  }

}



/* ============================================================
   MOSTRAR ITEMS
   ============================================================ */

function renderItems(){

  ensureModeButton();


  const grid =
    document.getElementById(
      'itemsGrid'
    );


  const query =
    normalizeText(
      document
        .getElementById(
          'searchInput'
        )
        .value
    );


  let items =
    MENU
      .filter(
        x =>
          x.negocio ===
          currentBusiness
      );


  /*
   * Si hay búsqueda,
   * busca en todas las categorías
   * del negocio.
   */

  if(query){

    items =
      items.filter(
        x => {

          const text =
            normalizeText(
              (
                x.item
                ||
                ''
              )
              +
              ' '
              +
              (
                x.categoria
                ||
                ''
              )
            );


          return text.includes(
            query
          );

        }
      );

  }


  /*
   * Sin búsqueda solo muestra
   * la categoría seleccionada.
   */

  else{

    items =
      items.filter(
        x =>
          x.categoria ===
          currentCategory
      );

  }


  if(
    !items.length
  ){

    grid.innerHTML =
      `
      <div class="loader">
        No hay ítems para mostrar.
      </div>
      `;

    return;

  }


  grid.innerHTML =
    items
      .map(
        item => {

          const line =
            accountLines.find(
              x =>
                x.id ===
                item.id
            );


          const count =
            line
            ?
            Number(
              line.cantidad
            )
            :
            0;


          const figure =
            getItemFigure(
              item
            );


          const priceMode =
            appMode ===
            'prices';


          return `
            <button
              type="button"
              class="
                item-btn
                ${
                  (
                    !priceMode
                    &&
                    count
                  )
                  ?
                  'selected'
                  :
                  ''
                }
              "
              data-item-id="${escapeAttr(item.id)}"
            >


              <!-- FIGURITA DEL ITEM -->

              <span
                style="
                  width:52px;
                  height:52px;
                  display:grid;
                  place-items:center;
                  align-self:center;
                  flex:0 0 auto;
                  margin-bottom:3px;
                  border-radius:15px;

                  background:
                    linear-gradient(
                      145deg,
                      #ffffff,
                      #e8f5ee
                    );

                  border:
                    1px solid
                    #cce4d6;

                  box-shadow:
                    inset 0 1px 0 rgba(255,255,255,.95),
                    0 4px 8px rgba(0,0,0,.10);

                  font-size:30px;
                  line-height:1;
                "
                aria-hidden="true"
              >
                ${figure}
              </span>


              <!-- NOMBRE -->

              <span
                class="item-name"
                style="
                  width:100%;
                  text-align:center;
                "
              >
                ${escapeHtml(
                  item.item
                )}
              </span>


              <!-- PRECIO Y CANTIDAD -->

              <span
                class="item-bottom"
                style="
                  width:100%;
                "
              >

                <span class="item-price">

                  ${
                    priceMode
                    ?
                    '✏️ '
                    :
                    ''
                  }

                  ${money(
                    item.valor
                  )}

                </span>


                ${
                  priceMode
                  ?
                  `
                  <span
                    class="item-count"
                    style="
                      min-width:auto;
                      padding:0 8px;
                      background:#d97706;
                    "
                  >
                    Editar
                  </span>
                  `
                  :
                  (
                    count
                    ?
                    `
                    <span class="item-count">

                      ${count}

                    </span>
                    `
                    :
                    ''
                  )
                }

              </span>


            </button>
          `;

        }
      )
      .join('');


  grid
    .querySelectorAll(
      '[data-item-id]'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            const id =
              button.dataset.itemId;


            if(
              appMode ===
              'prices'
            ){

              editPrice(
                id
              );

            }

            else{

              addItem(
                id
              );

            }

          }
        );

      }
    );

}



/* ============================================================
   MODIFICAR PRECIO
   ============================================================ */

async function editPrice(
  id
){

  if(
    changingPrice
  ){
    return;
  }


  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){

    setStatus(
      'No se encontró el ítem.',
      true
    );

    return;

  }


  const answer =
    window.prompt(
      'Nuevo precio para:\n'
      +
      item.item
      +
      '\n\nPrecio actual: '
      +
      money(
        item.valor
      )
      +
      '\n\nEscribe el nuevo precio:',
      Number(
        item.valor
      )
      .toFixed(
        2
      )
    );


  /*
   * Canceló.
   */

  if(
    answer ===
    null
  ){
    return;
  }


  let clean =
    String(
      answer
    )
    .trim()
    .replace(
      /L/gi,
      ''
    )
    .replace(
      /\s/g,
      ''
    );


  /*
   * Permitimos decimal con coma
   * cuando no existe punto.
   */

  if(
    clean.includes(',')
    &&
    !clean.includes('.')
  ){

    clean =
      clean.replace(
        ',',
        '.'
      );

  }

  else{

    clean =
      clean.replace(
        /,/g,
        ''
      );

  }


  const number =
    Number(
      clean
    );


  if(
    !Number.isFinite(
      number
    )
    ||
    number < 0
  ){

    setStatus(
      'El precio ingresado no es válido.',
      true
    );

    return;

  }


  const newPrice =
    Math.round(
      (
        number
        +
        Number.EPSILON
      )
      *
      100
    )
    /
    100;


  if(
    newPrice ===
    Number(
      item.valor
    )
  ){

    setStatus(
      'El precio no cambió.'
    );

    return;

  }


  changingPrice =
    true;


  try{

    setStatus(
      'Actualizando precio de '
      +
      item.item
      +
      '...'
    );


    const response =
      await jsonp(
        'updatePrice',
        {

          id:
            item.id,

          valor:
            newPrice,

          item:
            item.item,

          negocio:
            item.negocio,

          categoria:
            item.categoria

        }
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'No fue posible actualizar el precio.'
      );

    }


    /*
     * Cambiamos el valor local.
     * La cajita se actualiza inmediatamente.
     */

    item.valor =
      Number(
        response.valor
      );


    renderItems();


    setStatus(
      item.item
      +
      ': precio actualizado a '
      +
      money(
        item.valor
      )
      +
      '.'
    );

  }

  catch(error){

    console.error(
      error
    );


    setStatus(
      error.message
      ||
      'Error actualizando el precio.',
      true
    );

  }

  finally{

    changingPrice =
      false;

  }

}



/* ============================================================
   AGREGAR ITEM
   ============================================================ */

function addItem(
  id
){

  if(
    accountClosed
  ){

    setStatus(
      'La cuenta está cerrada. Presiona C para abrir una nueva cuenta.'
    );

    return;

  }


  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){
    return;
  }


  let line =
    accountLines.find(
      x =>
        x.id ===
        id
    );


  if(line){

    line.cantidad =
      Math.min(
        999,
        Number(
          line.cantidad
        )
        +
        1
      );

  }

  else{

    accountLines.push({

      id:
        item.id,

      negocio:
        item.negocio,

      categoria:
        item.categoria,

      item:
        item.item,

      valor:
        Number(
          item.valor
        )
        ||
        0,

      cantidad:
        1

    });

  }


  renderReceipt();

  renderItems();


  setStatus(
    item.item
    +
    ' agregado.'
  );

}

/* ============================================================
   TOTAL
   ============================================================ */

function accountTotal(){

  return accountLines
    .reduce(
      (
        total,
        line
      ) =>
        total
        +
        (
          Number(
            line.cantidad
          )
          *
          Number(
            line.valor
          )
        ),
      0
    );

}



/* ============================================================
   DETALLE
   ============================================================ */

function renderReceipt(){

  const receipt =
    document.getElementById(
      'receipt'
    );


  const total =
    document.getElementById(
      'grandTotal'
    );


  const state =
    document.getElementById(
      'accountState'
    );


  if(
    !accountLines.length
  ){

    receipt.innerHTML =
      `
      <div class="empty-receipt">
        Toca un ítem para iniciar la cuenta.
      </div>
      `;

  }

  else{

    receipt.innerHTML =
      accountLines
        .map(
          (
            line,
            index
          ) => {


            const subtotal =
              Number(
                line.cantidad
              )
              *
              Number(
                line.valor
              );


            const editing =
              editingLine ===
              index;


            return `
              <div
                class="
                  receipt-line
                  ${
                    editing
                    ?
                    'editing'
                    :
                    ''
                  }
                "
              >

                <button
                  type="button"
                  class="receipt-main"
                  onclick="toggleLine(${index})"
                >

                  <span class="line-qty">
                    ${line.cantidad}×
                  </span>

                  <span
                    class="line-name"
                    title="${escapeAttr(line.item)}"
                  >
                    ${escapeHtml(line.item)}
                  </span>

                  <span class="line-total">
                    ${money(subtotal)}
                  </span>

                </button>


                ${
                  editing

                  ?

                  `
                  <div class="line-editor">

                    <button
                      type="button"
                      onclick="changeQty(${index},-1)"
                      ${
                        Number(
                          line.cantidad
                        )
                        <=
                        1
                        ?
                        'disabled'
                        :
                        ''
                      }
                    >
                      −
                    </button>

                    <span class="line-count">
                      ${line.cantidad}
                    </span>

                    <button
                      type="button"
                      onclick="changeQty(${index},1)"
                    >
                      +
                    </button>

                    <button
                      type="button"
                      class="delete"
                      onclick="deleteLine(${index})"
                    >
                      🗑
                    </button>

                  </div>
                  `

                  :

                  ''
                }

              </div>
            `;

          }
        )
        .join('');

  }


  total.textContent =
    money(
      accountTotal()
    );


  state.textContent =
    accountClosed
    ?
    'TOTAL FINAL'
    :
    'TOTAL ACTUAL';


  requestAnimationFrame(
    () => {

      receipt.scrollTop =
        receipt.scrollHeight;

    }
  );

}



/* ============================================================
   EDITAR LINEA
   ============================================================ */

function toggleLine(
  index
){

  editingLine =
    editingLine ===
    index
    ?
    -1
    :
    index;


  renderReceipt();

}



/* ============================================================
   CAMBIAR CANTIDAD
   ============================================================ */

function changeQty(
  index,
  delta
){

  const line =
    accountLines[
      index
    ];


  if(
    !line
  ){
    return;
  }


  if(
    accountClosed
  ){

    accountClosed =
      false;

  }


  const next =
    Number(
      line.cantidad
    )
    +
    Number(
      delta
      ||
      0
    );


  if(
    next < 1
  ){
    return;
  }


  line.cantidad =
    Math.min(
      999,
      next
    );


  editingLine =
    index;


  renderReceipt();

  renderItems();

}



/* ============================================================
   ELIMINAR LINEA
   ============================================================ */

function deleteLine(
  index
){

  if(
    !accountLines[
      index
    ]
  ){
    return;
  }


  if(
    accountClosed
  ){

    accountClosed =
      false;

  }


  const name =
    accountLines[
      index
    ].item;


  accountLines.splice(
    index,
    1
  );


  editingLine =
    -1;


  renderReceipt();

  renderItems();


  setStatus(
    name
    +
    ' eliminado.'
  );

}



/* ============================================================
   =
   ============================================================ */

function closeAccount(){

  if(
    !accountLines.length
  ){

    setStatus(
      'No hay ítems para totalizar.'
    );

    return;

  }


  accountClosed =
    true;

  editingLine =
    -1;


  renderReceipt();

  renderItems();


  setStatus(
    'Total final: '
    +
    money(
      accountTotal()
    )
  );

}



/* ============================================================
   C
   ============================================================ */

function newAccount(
  showMessage = true
){

  accountLines =
    [];

  editingLine =
    -1;

  accountClosed =
    false;


  renderReceipt();

  renderItems();


  if(
    showMessage
  ){

    setStatus(
      'Nueva cuenta abierta.'
    );

  }

}



/* ============================================================
   ESTADO
   ============================================================ */

function setStatus(
  message,
  error = false
){

  const el =
    document.getElementById(
      'status'
    );


  el.textContent =
    message;


  el.classList.toggle(
    'error',
    error
  );

}



/* ============================================================
   MONEDA
   ============================================================ */

function money(
  value
){

  const n =
    Number(
      value
    )
    ||
    0;


  return 'L '
    +
    n.toLocaleString(
      'es-HN',
      {
        minimumFractionDigits:
          2,

        maximumFractionDigits:
          2
      }
    );

}



/* ============================================================
   NORMALIZAR
   ============================================================ */

function normalizeText(
  value
){

  return String(
    value
    ??
    ''
  )
  .normalize(
    'NFD'
  )
  .replace(
    /[\u0300-\u036f]/g,
    ''
  )
  .toLowerCase()
  .trim();

}



/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escapeHtml(
  value
){

  return String(
    value
    ??
    ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}



function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}

/* ============================================================
   CONVERTIR VALOR MONETARIO
   ============================================================ */

function parseMoneyInput(
  value
){

  let text =
    String(
      value
      ??
      ''
    )
    .trim()
    .replace(
      /L/gi,
      ''
    )
    .replace(
      /\s/g,
      ''
    );


  if(
    text.includes(',')
    &&
    !text.includes('.')
  ){

    text =
      text.replace(
        ',',
        '.'
      );

  }

  else{

    text =
      text.replace(
        /,/g,
        ''
      );

  }


  const number =
    Number(
      text
    );


  if(
    !Number.isFinite(
      number
    )
    ||
    number <
    0
  ){

    return null;

  }


  return Math.round(
    (
      number
      +
      Number.EPSILON
    )
    *
    100
  )
  /
  100;

}


/* ============================================================
   LLAVE INVENTARIO
   ============================================================ */

function inventoryKey(
  categoria,
  item
){

  return (
    normalizeText(
      categoria
    )
    +
    '||'
    +
    normalizeText(
      item
    )
  );

}


/* ============================================================
   OBTENER INVENTARIO DE ITEM
   ============================================================ */

function inventoryForItem(
  item
){

  const key =
    inventoryKey(
      item.categoria,
      item.item
    );


  return (
    inventorySnapshot.find(
      x =>
        inventoryKey(
          x.categoria,
          x.item
        )
        ===
        key
    )
    ||
    {

      id:

      cantidad:

      valorInventario:

      ultimaCompra:

      ultimaVenta:

  );

}


/* ============================================================
   CARGAR INVENTARIO
   ============================================================ */

async function loadInventorySnapshot(
  force = false
){

  if(
    inventoryLoading
  ){
    return;
  }


  if(
    !force
    &&
    inventorySnapshot.length
  ){
    return;
  }


  inventoryLoading =
    true;


  try{

    setStatus(
      'Actualizando inventario...'
    );


    const response =
      await jsonp(
        'inventorySnapshot',
        {},
        20000
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'No fue posible consultar el inventario.'
      );

    }


    inventorySnapshot =
      Array.isArray(
        response.items
      )
      ?
      response.items
      :
      [];

  }

  catch(error){

    console.error(
      error
    );


    setStatus(
      error.message
      ||
      'Error consultando inventario.',
      true
    );

  }

  finally{

    inventoryLoading =
      false;

  }

}

   ============================================================ */

function effectiveSalePrice(
  item
){

  const discount =
    Number(
      saleDiscounts[
        item.id
      ]
      ||
      0
    );


  const base =
    Number(
      item.valor
    )
    ||
    0;


  return Math.round(
    (
      base
      *
      (
        1
        -
        discount
        /
        100
      )
      +
      Number.EPSILON
    )
    *
    100
  )
  /
  100;

}

                    "
                  >
                    ${escapeHtml(badge)}
                  </span>
                  `
                  :
                  ''
                }

            </button>

        }
      )
      .join('');


  grid

/* ============================================================
   AGREGAR A VENTA
   ============================================================ */

function addItem(
  id
){

  if(
    accountClosed
  ){

    setStatus(
      'La cuenta está cerrada. Presiona C para abrir una nueva cuenta.'
    );


    return;

  }


  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){

    return;

  }


  let line =
    accountLines.find(
      x =>
        x.id ===
        id
    );


  if(
    line
  ){

    line.cantidad =
      Math.min(
        999,
        Number(
          line.cantidad
        )
        +
        1
      );


    line.valor =
      effectiveSalePrice(
        item
      );

  }

  else{

    accountLines.push({

      id:
        item.id,

      negocio:
        item.negocio,

      categoria:
        item.categoria,

      item:
        item.item,

      baseValor:
        Number(
          item.valor
        )
        ||
        0,

      valor:
        effectiveSalePrice(
          item
        ),

      cantidad:
        1

    });

  }


  renderReceipt();

  renderItems();


  setStatus(
    item.item
    +
    ' agregado.'
  );

}


/* ============================================================
   DESCUENTOS
   ============================================================ */

function applyDiscount(
  id
){

  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){

    return;

  }


  const current =
    Number(
      saleDiscounts[
        id
      ]
      ||
      0
    );


  const answer =
    window.prompt(
      'Descuento para:\n'
      +
      item.item
      +
      '\n\nEscribe porcentaje de 0 a 100:',
      String(
        current
      )
    );


  if(
    answer ===
    null
  ){

    return;

  }


  const percent =
    Number(
      String(
        answer
      )
      .replace(
        ',',
        '.'
      )
    );


  if(
    !Number.isFinite(
      percent
    )
    ||
    percent <
    0
    ||
    percent >
    100
  ){

    setStatus(
      'El descuento debe estar entre 0 y 100.',
      true
    );


    return;

  }


  if(
    percent ===
    0
  ){

    delete saleDiscounts[
      id
    ];

  }

  else{

    saleDiscounts[
      id
    ] =
      Math.round(
        percent
        *
        100
      )
      /
      100;

  }


  const line =
    accountLines.find(
      x =>
        x.id ===
        id
    );


  if(
    line
  ){

    line.valor =
      effectiveSalePrice(
        item
      );

  }


  renderReceipt();

  renderItems();


  setStatus(
    percent
    ?
    item.item
    +
    ': descuento '
    +
    percent
    +
    '% aplicado.'
    :
    item.item
    +
    ': descuento eliminado.'
  );

}

    'valor';


  let title =
    'DETALLE DE CUENTA';


  let emptyText =
    'Toca un ítem para iniciar la cuenta.';


  let totalValue =
    accountTotal();


  if(
    appMode ===
    'purchases'
  ){

    lines =
      purchaseLines;


    valueField =
      'costo';


    title =
      'DETALLE DE COMPRA';


    emptyText =
      'Toca un ítem para iniciar la compra.';


    totalValue =
      purchaseTotal();

  }


  else if(
    appMode ===
    'quote'
  ){

    lines =
      quoteLines;


    valueField =
      'valor';


    title =
      'COTIZACIÓN';


    emptyText =
      'Toca un ítem para iniciar la cotización.';


    totalValue =
      quoteTotal();

  }


  else if(
    [
      'inventory',
      'adjustments',
      'returns',
      'margin',
      'query',
      'prices'
    ]
    .includes(
      appMode
    )
  ){

    lines =
      [];


    title =
      MODE_INFO[
        appMode
      ].label
      .replace(
        /^\S+\s/,
        ''
      )
      .toUpperCase();


    emptyText =
      MODE_INFO[
        appMode
      ].text;


    totalValue =
      0;

  }


  else if(
    appMode ===
    'discounts'
  ){

    title =
      'VENTA CON DESCUENTOS';


    emptyText =
      'Aplica descuentos y vuelve a Modo Ventas para cobrar.';

  }


  if(
    screenTitle
  ){

    screenTitle.textContent =
      title;

  }


  if(
    !lines.length
  ){

    receipt.innerHTML =
      `
      <div class="empty-receipt">
        ${escapeHtml(emptyText)}
      </div>
      `;

  }

  else{

    receipt.innerHTML =
      lines
        .map(
          (
            line,
            index
          ) => {

            const subtotal =
              Number(
                line.cantidad
              )
              *
              Number(
                line[
                  valueField
                ]
              );


            const editing =
              editingLine ===
              index;


            const purchaseMode =
              appMode ===
              'purchases';


            return `
              <div
                class="
                  receipt-line
                  ${
                    editing
                    ?
                    'editing'
                    :
                    ''
                  }
                "
              >

                <button
                  type="button"
                  class="receipt-main"
                  onclick="toggleLine(${index})"
                >

                  <span class="line-qty">
                    ${line.cantidad}×
                  </span>

                  <span
                    class="line-name"
                    title="${escapeAttr(line.item)}"
                  >
                    ${escapeHtml(line.item)}
                  </span>

                  <span class="line-total">
                    ${money(subtotal)}
                  </span>

                </button>

                ${
                  editing
                  ?
                  `
                  <div
                    class="line-editor"
                    ${
                      purchaseMode
                      ?
                      `
                      style="
                        grid-template-columns:
                        42px 50px 42px 72px 42px;
                      "
                      `
                      :
                      ''
                    }
                  >

                    <button
                      type="button"
                      onclick="changeQty(${index},-1)"
                      ${
                        Number(
                          line.cantidad
                        )
                        <=
                        1
                        ?
                        'disabled'
                        :
                        ''
                      }
                    >
                      −
                    </button>

                    <span class="line-count">
                      ${line.cantidad}
                    </span>

                    <button
                      type="button"
                      onclick="changeQty(${index},1)"
                    >
                      +
                    </button>

                    ${
                      purchaseMode
                      ?
                      `
                      <button
                        type="button"
                        onclick="editPurchaseCost(${index})"
                        style="font-size:11px;"
                      >
                        Costo
                      </button>
                      `
                      :
                      ''
                    }

                    <button
                      type="button"
                      class="delete"
                      onclick="deleteLine(${index})"
                    >
                      🗑
                    </button>

                  </div>
                  `
                  :
                  ''
                }

              </div>
            `;

          }
        )
        .join('');

  }


  total.textContent =
    money(
      totalValue
    );


  if(
    appMode ===
    'purchases'
  ){

    state.textContent =
      'TOTAL COMPRA';

  }

  else if(
    appMode ===
    'quote'
  ){

    state.textContent =
      'TOTAL COTIZACIÓN';

  }

  else if(
    [
      'inventory',
      'adjustments',
      'returns',
      'margin',
      'query',
      'prices'
    ]
    .includes(
      appMode
    )
  ){

    state.textContent =
      'MODO CONSULTA';

  }

  else{

    state.textContent =
      accountClosed
      ?
      'TOTAL FINAL'
      :
      'TOTAL ACTUAL';

  }


  requestAnimationFrame(
    () => {

      receipt.scrollTop =
        receipt.scrollHeight;

    }
  );

}


/* ============================================================
   EDITAR LINEA
   ============================================================ */

function toggleLine(
  index
){

  editingLine =
    editingLine ===
    index
    ?
    -1
    :
    index;


  renderReceipt();

}


/* ============================================================
   LINEAS SEGUN MODO
   ============================================================ */

function activeEditableLines(){

  if(
    appMode ===
    'purchases'
  ){

    return purchaseLines;

  }


  if(
    appMode ===
    'quote'
  ){

    return quoteLines;

  }


  return accountLines;

}


/* ============================================================
   CAMBIAR CANTIDAD
   ============================================================ */

function changeQty(
  index,
  delta
){

  const lines =
    activeEditableLines();


  const line =
    lines[
      index
    ];


  if(
    !line
  ){

    return;

  }


  if(
    appMode !==
    'purchases'
    &&
    appMode !==
    'quote'
    &&
    accountClosed
  ){

    accountClosed =
      false;

  }


  const next =
    Number(
      line.cantidad
    )
    +
    Number(
      delta
      ||
      0
    );


  if(
    next <
    1
  ){

    return;

  }


  line.cantidad =
    Math.min(
      999,
      next
    );


  editingLine =
    index;


  renderReceipt();

  renderItems();

}


/* ============================================================
   ELIMINAR LINEA
   ============================================================ */

function deleteLine(
  index
){

  const lines =
    activeEditableLines();


  if(
    !lines[
      index
    ]
  ){

    return;

  }


  if(
    appMode !==
    'purchases'
    &&
    appMode !==
    'quote'
    &&
    accountClosed
  ){

    accountClosed =
      false;

  }


  const name =
    lines[
      index
    ].item;


  lines.splice(
    index,
    1
  );


  editingLine =
    -1;


  renderReceipt();

  renderItems();


  setStatus(
    name
    +
    ' eliminado.'
  );

}

   ============================================================ */

async function adjustInventoryItem(
  id
){

  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){

    return;

  }


  const inv =
    inventoryForItem(
      item
    );


  const answer =
    window.prompt(
      'Ajuste de inventario:\n'
      +
      item.item
      +
      '\n\nExistencia sistema: '
      +
      Number(
        inv.cantidad
        ||
        0
      )
      +
      '\nEscribe la existencia física real:',
      String(
        Number(
          inv.cantidad
          ||
          0
        )
      )
    );


  if(
    answer ===
    null
  ){

    return;

  }


  const target =
    Number(
      String(
        answer
      )
      .replace(
        ',',
        '.'
      )
    );


  if(
    !Number.isInteger(
      target
    )
    ||
    target <
    0
  ){

    setStatus(
      'La existencia física debe ser un número entero igual o mayor que 0.',
      true
    );


    return;

  }


  const reason =
    window.prompt(
      'Motivo del ajuste (opcional):',
      'Conteo físico'
    )
    ??
    '';


  try{

    setStatus(
      'Guardando ajuste...'
    );


    const response =
      await jsonp(
        'saveAdjustment',
        {

          categoria:
            item.categoria,

          item:
            item.item,

          existencia:
            target,

          motivo:
            reason

        },
        20000
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'No fue posible guardar el ajuste.'
      );

    }


    invalidateInventory();


    await loadInventorySnapshot(
      true
    );


    renderItems();


    setStatus(
      response.message
      ||

/* ============================================================
   DEVOLUCIONES
   ============================================================ */

async function registerReturn(
  id
){

  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){

    return;

  }


  const inv =
    inventoryForItem(
      item
    );


  const typeAnswer =
    window.prompt(
      'Devolución de:\n'
      +
      item.item
      +
      '\n\n'
      +
      '1 = Cliente devuelve producto (entra al inventario)\n'
      +
      '2 = Devolución al proveedor (sale del inventario)\n\n'
      +
      'Escribe 1 o 2:',
      '1'
    );


  if(
    typeAnswer ===
    null
  ){

    return;

  }


  const type =
    String(
      typeAnswer
    )
    .trim() ===
    '2'
    ?
    'purchase'
    :
    String(
      typeAnswer
    )
    .trim() ===
    '1'
    ?
    'sale'
    :
    '';


  if(
    !type
  ){

    setStatus(
      'Selecciona 1 o 2.',
      true
    );


    return;

  }


  const qtyAnswer =
    window.prompt(
      'Cantidad a devolver:',
      '1'
    );


  if(
    qtyAnswer ===
    null
  ){

    return;

  }


  const qty =
    Number(
      qtyAnswer
    );


  if(
    !Number.isInteger(
      qty
    )
    ||
    qty <=
    0
  ){

    setStatus(
      'La cantidad debe ser un entero mayor que 0.',
      true
    );


    return;

  }


  if(
    type ===
    'purchase'
    &&
    qty >
    Number(
      inv.cantidad
      ||
      0
    )
  ){

    setStatus(
      'No puedes devolver al proveedor más unidades de las disponibles.',
      true
    );


    return;

  }


  let reference =
    '';


  if(
    type ===
    'purchase'
  ){

    reference =
      window.prompt(
        'Proveedor o referencia de la devolución (opcional):',
        currentSupplier
        ||
        ''
      )
      ??
      '';

  }

  else{

    reference =
      window.prompt(
        'Referencia o motivo de la devolución (opcional):',
        'Devolución cliente'
      )
      ??
      '';

  }


  try{

    setStatus(
      'Registrando devolución...'
    );


    const response =
      await jsonp(
        'saveReturn',
        {

          tipo:
            type,

          categoria:
            item.categoria,

          item:
            item.item,

          cantidad:
            qty,

          referencia:
            reference

        },
        20000
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'No fue posible registrar la devolución.'
      );

    }


    invalidateInventory();


    await loadInventorySnapshot(
      true
    );


    renderItems();


    setStatus(
      response.message
      ||
      'Devolución registrada correctamente.'
    );

  }

  catch(error){

    console.error(
      error
    );


    setStatus(
      error.message
      ||
      'Error registrando devolución.',
      true
    );

  }

}

function newAccount(

/* ============================================================
   CONVERTIR COTIZACION A VENTA
   ============================================================ */

function convertQuoteToSale(){

  if(
    !quoteLines.length
  ){

    setStatus(
      'La cotización está vacía.',
      true
    );


    return;

  }


  accountLines =
    quoteLines.map(
      line => ({

        ...line,

        baseValor:
          Number(
            line.valor
          )
          ||
          0

      })
    );


  quoteLines =
    [];


  saleDiscounts =
    {};


  accountClosed =
    false;


  appMode =
    'sales';


  updateModeButton();

  renderReceipt();

  renderItems();


  setStatus(
    'Cotización convertida a venta. Revisa la cuenta y presiona = para cobrar.'
  );

}


/* ============================================================
   =
   ============================================================ */

function closeAccount(){

  if(
    appMode ===
    'prices'
  ){

    return;

  }


  if(
    appMode ===
    'purchases'
  ){

    return savePurchase();

  }


  if(
    appMode ===
    'quote'
  ){

    return convertQuoteToSale();

  }


  if(
    [
      'inventory',
      'adjustments',
      'returns',
      'margin',
      'discounts',
      'query'
    ]
    .includes(
      appMode
    )
  ){

    return;

  }


  if(
    !accountLines.length
  ){

    setStatus(
      'No hay ítems para totalizar.'
    );


    return;

  }


  accountClosed =
    true;


  editingLine =
    -1;


  renderReceipt();

  renderItems();


  setStatus(
    'Total final: '
    +
    money(
      accountTotal()
    )
  );


  openCashPayment();

}


/* ============================================================
   GUARDAR COMPRA
   ============================================================ */

async function savePurchase(){

  if(
    purchaseSaving
  ){

    return;

  }


  if(
    !purchaseLines.length
  ){

    setStatus(
      'No hay productos en la compra.',
      true
    );


    return;

  }


  const supplierInput =
    document.getElementById(
      'purchaseSupplier'
    );


  const supplier =
    String(
      (
        supplierInput
        ?
        supplierInput.value
        :
        currentSupplier
      )
      ||
      ''
    )
    .trim();


  if(
    !supplier
  ){

    setStatus(
      'Debes indicar el proveedor de la compra.',
      true
    );


    if(
      supplierInput
    ){

      supplierInput.focus();

    }


    return;

  }


  currentSupplier =
    supplier;


  try{

    localStorage.setItem(
      'cajaLastSupplier',
      currentSupplier
    );

  }

  catch(_){
  }


  const items =
    purchaseLines.map(
      line => ({

        categoria:
          String(
            line.categoria
            ||
            ''
          ),

        cantidad:
          Number(
            line.cantidad
          )
          ||
          0,

        item:
          String(
            line.item
            ||
            ''
          ),

        costo:
          Number(
            line.costo
          )
          ||
          0

      })
    );


  const button =
    document.querySelector(
      '.operations .op.equal'
    );


  purchaseSaving =
    true;


  if(
    button
  ){

    button.disabled =
      true;


    button.textContent =
      'Guardando...';


    button.style.opacity =
      '.65';

  }


  try{

    setStatus(
      'Guardando compra...'
    );


    const response =
      await jsonp(
        'savePurchase',
        {

          proveedor:
            supplier,

          items:
            JSON.stringify(
              items
            )

        },
        20000
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'No fue posible guardar la compra.'
      );

    }


    purchaseLines =
      [];


    editingLine =
      -1;


    invalidateInventory();


    renderReceipt();

    renderItems();


    setStatus(
      'Compra guardada correctamente. Total: '
      +
      money(
        response.total
      )
      +
      '. Proveedor: '
      +
      supplier
      +
      '.'
    );

  }

  catch(error){

    console.error(
      error
    );


    setStatus(
      error.message
      ||
      'No fue posible guardar la compra.',
      true
    );

  }

  finally{

    purchaseSaving =
      false;


    updateOperationButtons();

  }

}


/* ============================================================
   ABRIR COBRO
   ============================================================ */

function openCashPayment(){

  cashEntry =
    '';


  const overlay =
    document.getElementById(
      'cashPaymentOverlay'
    );


  const total =
    document.getElementById(
      'paymentTotal'
    );


  const input =
    document.getElementById(
      'cashReceived'
    );


  total.textContent =
    money(
      accountTotal()
    );


  input.value =
    '';


  updateCashChange();


  overlay
    .classList
    .add(
      'show'
    );


  document.body.style.overflow =
    'hidden';


  setTimeout(
    () =>
      input.focus(),
    80
  );

}


/* ============================================================
   TECLADO COBRO
   ============================================================ */

function cashKey(
  key
){

  if(
    key ===
    '.'
  ){

    if(
      cashEntry.includes(
        '.'
      )
    ){

      return;

    }


    if(
      !cashEntry
    ){

      cashEntry =
        '0';

    }

  }


  if(
    cashEntry.includes(
      '.'
    )
  ){

    const decimals =
      cashEntry
        .split(
          '.'
        )[1]
      ||
      '';


    if(
      decimals.length >=
      2
      &&
      key !==
      '.'
    ){

      return;

    }

  }


  if(
    cashEntry
      .replace(
        '.',
        ''
      )
      .length >=
      10
  ){

    return;

  }


  cashEntry +=
    key;


  document
    .getElementById(
      'cashReceived'
    )
    .value =
    cashEntry;


  updateCashChange();

}


function cashBackspace(){

  cashEntry =
    cashEntry.slice(
      0,
      -1
    );


  document
    .getElementById(
      'cashReceived'
    )
    .value =
    cashEntry;


  updateCashChange();

}


function cashClear(){

  cashEntry =
    '';


  document
    .getElementById(
      'cashReceived'
    )
    .value =
    '';


  updateCashChange();

}


function cashManualInput(){

  const input =
    document.getElementById(
      'cashReceived'
    );


  let value =
    String(
      input.value
      ||
      ''
    )
    .replace(
      /[^0-9.]/g,
      ''
    );


  const parts =
    value.split(
      '.'
    );


  if(
    parts.length >
    2
  ){

    value =
      parts.shift()
      +
      '.'
      +
      parts.join(
        ''
      );

  }


  if(
    value.includes(
      '.'
    )
  ){

    const p =
      value.split(
        '.'
      );


    value =
      p[0]
      +
      '.'
      +
      (
        p[1]
        ||
        ''
      )
      .slice(
        0,
        2
      );

  }


  cashEntry =
    value;


  input.value =
    value;


  updateCashChange();

}


/* ============================================================
   CAMBIO
   ============================================================ */

function updateCashChange(){

  const received =
    Number(
      cashEntry
      ||
      0
    );


  const total =
    Number(
      accountTotal()
    )
    ||
    0;


  const change =
    received
    -
    total;


  const el =
    document.getElementById(
      'cashChange'
    );


  el.textContent =
    money(
      change
    );


  el.classList.toggle(
    'negative',
    change <
    0
  );

}


/* ============================================================
   VOLVER
   ============================================================ */

function cancelCashPayment(){

  document
    .getElementById(
      'cashPaymentOverlay'
    )
    .classList
    .remove(
      'show'
    );


  document.body.style.overflow =
    '';


  accountClosed =
    false;


  renderReceipt();

  renderItems();


  setStatus(
    'Cuenta abierta para continuar.'
  );

}


/* ============================================================
   FINALIZAR VENTA
   ============================================================ */

async function finishCashPayment(){

  const received =
    Number(
      cashEntry
      ||
      0
    );


  const total =
    Number(
      accountTotal()
    )
    ||
    0;


  if(
    received <
    total
  ){

    setStatus(
      'El efectivo recibido es menor que el total.',
      true
    );


    document
      .getElementById(
        'cashReceived'
      )
      .focus();


    return;

  }


  if(
    !accountLines.length
  ){

    setStatus(
      'No hay productos para guardar.',
      true
    );


    return;

  }


  const change =
    received
    -
    total;


  const finishButton =
    document.querySelector(
      '.payment-action.finish'
    );


  if(
    finishButton
  ){

    finishButton.disabled =
      true;


    finishButton.textContent =
      'Guardando...';


    finishButton.style.opacity =
      '.65';


    finishButton.style.cursor =
      'wait';

  }


  const saleItems =
    accountLines.map(
      line => ({

        categoria:
          String(
            line.categoria
            ||
            ''
          ),

        cantidad:
          Number(
            line.cantidad
          )
          ||
          0,

        item:
          String(
            line.item
            ||
            ''
          ),

        valor:
          Number(
            line.valor
          )
          ||
          0

      })
    );


  try{

    setStatus(
      'Guardando venta...'
    );


    const response =
      await jsonp(
        'saveSale',
        {

          items:
            JSON.stringify(
              saleItems
            )

        },
        20000
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'No fue posible guardar la venta.'
      );

    }


    document
      .getElementById(
        'cashPaymentOverlay'
      )
      .classList
      .remove(
        'show'
      );


    document.body.style.overflow =
      '';


    accountLines =
      [];


    saleDiscounts =
      {};


    editingLine =
      -1;


    accountClosed =
      false;


    cashEntry =
      '';


    invalidateInventory();


    renderReceipt();

    renderItems();


    setStatus(
      'Venta guardada correctamente. Cambio entregado: '
      +
      money(
        change
      )
    );

  }

  catch(error){

    console.error(
      error
    );


    setStatus(
      error.message
      ||
      'No fue posible guardar la venta.',
      true
    );


    document
      .getElementById(
        'cashReceived'
      )
      .focus();

  }

  finally{

    if(
      finishButton
    ){

      finishButton.disabled =
        false;


      finishButton.textContent =
        'Nueva venta';


      finishButton.style.opacity =
        '1';


      finishButton.style.cursor =
        'pointer';

    }

  }

}
