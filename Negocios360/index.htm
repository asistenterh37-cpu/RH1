<script>

/* ============================================================
   CONFIGURACION FISCAL DE FACTURA

   CAMBIA ESTOS DATOS POR LOS DEL NEGOCIO REAL.
   ============================================================ */

const INVOICE_CONFIG = {

  /*
   * Nombre legal o razón social.
   */

  razonSocial:
    'NOMBRE O RAZÓN SOCIAL',


  /*
   * Nombre comercial.
   * Si queda vacío usa el negocio seleccionado.
   */

  nombreComercial:
    '',


  rtn:
    '0000-0000-000000',


  direccion:
    'Dirección del negocio',


  telefono:
    '0000-0000',


  correo:
    '',


  /*
   * CAI autorizado.
   */

  cai:
    'CONFIGURA AQUÍ EL CAI',


  /*
   * Rango autorizado.
   *
   * Deben conservar el formato:
   * 000-000-00-00000000
   */

  rangoDesde:
    '000-001-01-00000001',

  rangoHasta:
    '000-001-01-00000500',


  /*
   * Fecha límite de emisión.
   */

  fechaLimite:
    '31/12/2026',


  /*
   * TRATAMIENTO FISCAL DEL PROTOTIPO
   *
   * opciones:
   *
   * gravado15
   * gravado18
   * exento
   * exonerado
   *
   * Esta versión aplica el mismo tratamiento
   * a todos los productos de una factura.
   */

  tratamientoFiscal:
    'gravado15',


  /*
   * Los precios registrados en Negocios360
   * se consideran precios finales con ISV
   * ya incluido.
   */

  preciosIncluyenISV:
    true,


  pie:
    'Gracias por su compra.'

};


/* ============================================================
   ESTADO
   ============================================================ */

let lastInvoice =
  null;


let invoiceSaleCompleted =
  false;


const originalOpenCashPaymentInvoice =
  openCashPayment;


const originalCancelCashPaymentInvoice =
  cancelCashPayment;


/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function invoiceEscape(
  value
){

  return String(
    value
    ??
    ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


/* ============================================================
   REDONDEO
   ============================================================ */

function invoiceRound(
  value
){

  return Math.round(
    (
      Number(
        value
      )
      +
      Number.EPSILON
    )
    *
    100
  )
  /
  100;

}


/* ============================================================
   FECHA
   ============================================================ */

function invoiceDateText(
  value
){

  const date =
    value
    ?
    new Date(
      value
    )
    :
    new Date();


  if(
    isNaN(
      date.getTime()
    )
  ){

    return String(
      value
      ||
      ''
    );

  }


  return date.toLocaleString(
    'es-HN',
    {

      day:
        '2-digit',

      month:
        '2-digit',

      year:
        'numeric',

      hour:
        '2-digit',

      minute:
        '2-digit'

    }
  );

}


/* ============================================================
   NUMERO DE FACTURA - PROTOTIPO

   Se guarda en localStorage del dispositivo.

   IMPORTANTE:
   Para operación fiscal real y varias cajas,
   luego debemos mover este consecutivo a GS.
   ============================================================ */

function invoiceNumberParts(
  number
){

  const match =
    String(
      number
      ||
      ''
    )
    .trim()
    .match(
      /^(\d{3})-(\d{3})-(\d{2})-(\d{8})$/
    );


  if(
    !match
  ){

    throw new Error(
      'El número de factura configurado no tiene el formato correcto.'
    );

  }


  return {

    establecimiento:
      match[
        1
      ],

    punto:
      match[
        2
      ],

    tipo:
      match[
        3
      ],

    correlativo:
      Number(
        match[
          4
        ]
      )

  };

}


/* ============================================================
   FORMATEAR NUMERO
   ============================================================ */

function formatInvoiceNumber(
  parts
){

  return (
    parts.establecimiento
    +
    '-'
    +
    parts.punto
    +
    '-'
    +
    parts.tipo
    +
    '-'
    +
    String(
      parts.correlativo
    )
    .padStart(
      8,
      '0'
    )
  );

}


/* ============================================================
   RESERVAR NUMERO
   ============================================================ */

function reserveInvoiceNumber(){

  const start =
    invoiceNumberParts(
      INVOICE_CONFIG.rangoDesde
    );


  const end =
    invoiceNumberParts(
      INVOICE_CONFIG.rangoHasta
    );


  const storageKey =
    'Negocios360Factura:'
    +
    INVOICE_CONFIG.rangoDesde;


  let currentText =
    '';


  try{

    currentText =
      localStorage.getItem(
        storageKey
      )
      ||
      INVOICE_CONFIG.rangoDesde;

  }

  catch(_){

    currentText =
      INVOICE_CONFIG.rangoDesde;

  }


  const current =
    invoiceNumberParts(
      currentText
    );


  if(
    current.correlativo >
    end.correlativo
  ){

    throw new Error(
      'Se agotó el rango autorizado de facturación.'
    );

  }


  const issued =
    formatInvoiceNumber(
      current
    );


  const next = {

    ...current,

    correlativo:
      current.correlativo
      +
      1

  };


  try{

    localStorage.setItem(
      storageKey,
      formatInvoiceNumber(
        next
      )
    );

  }

  catch(_){
  }


  return issued;

}


/* ============================================================
   IMPUESTOS
   ============================================================ */

function invoiceTaxes(
  total
){

  const treatment =
    String(
      INVOICE_CONFIG.tratamientoFiscal
      ||
      ''
    )
    .toLowerCase();


  const result = {

    exento:
      0,

    exonerado:
      0,

    gravado15:
      0,

    isv15:
      0,

    gravado18:
      0,

    isv18:
      0

  };


  const amount =
    invoiceRound(
      total
    );


  if(
    treatment ===
    'exento'
  ){

    result.exento =
      amount;


    return result;

  }


  if(
    treatment ===
    'exonerado'
  ){

    result.exonerado =
      amount;


    return result;

  }


  let rate =
    0;


  if(
    treatment ===
    'gravado18'
  ){

    rate =
      18;

  }

  else{

    rate =
      15;

  }


  let base;
  let tax;


  if(
    INVOICE_CONFIG.preciosIncluyenISV
  ){

    base =
      amount
      /
      (
        1
        +
        rate
        /
        100
      );


    tax =
      amount
      -
      base;

  }

  else{

    base =
      amount;


    tax =
      base
      *
      rate
      /
      100;

  }


  base =
    invoiceRound(
      base
    );


  tax =
    invoiceRound(
      tax
    );


  if(
    rate ===
    18
  ){

    result.gravado18 =
      base;


    result.isv18 =
      tax;

  }

  else{

    result.gravado15 =
      base;


    result.isv15 =
      tax;

  }


  return result;

}


/* ============================================================
   NUMERO A LETRAS
   ============================================================ */

function invoiceUnderHundred(
  number
){

  const units = [
    '',
    'UNO',
    'DOS',
    'TRES',
    'CUATRO',
    'CINCO',
    'SEIS',
    'SIETE',
    'OCHO',
    'NUEVE'
  ];


  const special = {

    10:
      'DIEZ',

    11:
      'ONCE',

    12:
      'DOCE',

    13:
      'TRECE',

    14:
      'CATORCE',

    15:
      'QUINCE',

    16:
      'DIECISÉIS',

    17:
      'DIECISIETE',

    18:
      'DIECIOCHO',

    19:
      'DIECINUEVE',

    20:
      'VEINTE',

    21:
      'VEINTIUNO',

    22:
      'VEINTIDÓS',

    23:
      'VEINTITRÉS',

    24:
      'VEINTICUATRO',

    25:
      'VEINTICINCO',

    26:
      'VEINTISÉIS',

    27:
      'VEINTISIETE',

    28:
      'VEINTIOCHO',

    29:
      'VEINTINUEVE'

  };


  if(
    number <
    10
  ){

    return units[
      number
    ];

  }


  if(
    special[
      number
    ]
  ){

    return special[
      number
    ];

  }


  const tensNames = {

    3:
      'TREINTA',

    4:
      'CUARENTA',

    5:
      'CINCUENTA',

    6:
      'SESENTA',

    7:
      'SETENTA',

    8:
      'OCHENTA',

    9:
      'NOVENTA'

  };


  const tens =
    Math.floor(
      number
      /
      10
    );


  const unit =
    number
    %
    10;


  return (
    tensNames[
      tens
    ]
    +
    (
      unit
      ?
      ' Y '
      +
      units[
        unit
      ]
      :
      ''
    )
  );

}


/* ============================================================
   MENOR A MIL
   ============================================================ */

function invoiceUnderThousand(
  number
){

  if(
    number <
    100
  ){

    return invoiceUnderHundred(
      number
    );

  }


  if(
    number ===
    100
  ){

    return 'CIEN';

  }


  const hundreds = {

    1:
      'CIENTO',

    2:
      'DOSCIENTOS',

    3:
      'TRESCIENTOS',

    4:
      'CUATROCIENTOS',

    5:
      'QUINIENTOS',

    6:
      'SEISCIENTOS',

    7:
      'SETECIENTOS',

    8:
      'OCHOCIENTOS',

    9:
      'NOVECIENTOS'

  };


  const hundred =
    Math.floor(
      number
      /
      100
    );


  const rest =
    number
    %
    100;


  return (
    hundreds[
      hundred
    ]
    +
    (
      rest
      ?
      ' '
      +
      invoiceUnderHundred(
        rest
      )
      :
      ''
    )
  );

}


/* ============================================================
   ENTERO A LETRAS
   ============================================================ */

function invoiceIntegerWords(
  number
){

  number =
    Math.floor(
      Number(
        number
      )
      ||
      0
    );


  if(
    number ===
    0
  ){

    return 'CERO';

  }


  if(
    number <
    1000
  ){

    return invoiceUnderThousand(
      number
    );

  }


  if(
    number <
    1000000
  ){

    const thousands =
      Math.floor(
        number
        /
        1000
      );


    const rest =
      number
      %
      1000;


    const prefix =
      thousands ===
      1
      ?
      'MIL'
      :
      invoiceUnderThousand(
        thousands
      )
      +
      ' MIL';


    return (
      prefix
      +
      (
        rest
        ?
        ' '
        +
        invoiceUnderThousand(
          rest
        )
        :
        ''
      )
    );

  }


  const millions =
    Math.floor(
      number
      /
      1000000
    );


  const rest =
    number
    %
    1000000;


  const prefix =
    millions ===
    1
    ?
    'UN MILLÓN'
    :
    invoiceIntegerWords(
      millions
    )
    +
    ' MILLONES';


  return (
    prefix
    +
    (
      rest
      ?
      ' '
      +
      invoiceIntegerWords(
        rest
      )
      :
      ''
    )
  );

}


/* ============================================================
   APOCOPE UNO
   ============================================================ */

function invoiceApocope(
  text
){

  return String(
    text
    ||
    ''
  )
  .replace(
    /VEINTIUNO$/,
    'VEINTIÚN'
  )
  .replace(
    / Y UNO$/,
    ' Y UN'
  )
  .replace(
    /UNO$/,
    'UN'
  );

}


/* ============================================================
   TOTAL A LETRAS
   ============================================================ */

function invoiceAmountWords(
  amount
){

  const rounded =
    invoiceRound(
      amount
    );


  const integer =
    Math.floor(
      rounded
    );


  const cents =
    Math.round(
      (
        rounded
        -
        integer
      )
      *
      100
    );


  const words =
    invoiceApocope(
      invoiceIntegerWords(
        integer
      )
    );


  return (
    words
    +
    ' '
    +
    (
      integer ===
      1
      ?
      'LEMPIRA'
      :
      'LEMPIRAS'
    )
    +
    ' CON '
    +
    String(
      cents
    )
    .padStart(
      2,
      '0'
    )
    +
    '/100'
  );

}

finishCashPayment =
  async function(){

    if(
      invoiceSaleCompleted
    ){

      return;

    }


    const received =
      Number(
        cashEntry
        ||
        0
      );


    const total =
      Number(
        accountTotal()
      )
      ||
      0;


    if(
      received <
      total
    ){

      setStatus(
        'El efectivo recibido es menor que el total.',
        true
      );


      document
        .getElementById(
          'cashReceived'
        )
        .focus();


      return;

    }


    if(
      !accountLines.length
    ){

      setStatus(
        'No hay productos para guardar.',
        true
      );


      return;

    }


    const change =
      invoiceRound(
        received
        -
        total
      );


    const finishButton =
      document.querySelector(
        '.payment-action.finish'
      );


    if(
      finishButton
    ){

      finishButton.disabled =
        true;


      finishButton.textContent =
        'Guardando...';


      finishButton.style.opacity =
        '.65';


      finishButton.style.cursor =
        'wait';

    }


    const saleItems =
      accountLines.map(
        line => ({

          categoria:
            String(
              line.categoria
              ||
              ''
            ),

          cantidad:
            Number(
              line.cantidad
            )
            ||
            0,

          item:
            String(
              line.item
              ||
              ''
            ),

          valor:
            Number(
              line.valor
            )
            ||
            0

        })
      );


    try{

      setStatus(
        'Guardando venta...'
      );


      const response =
        await jsonp(
          'saveSale',
          {

            items:
              JSON.stringify(
                saleItems
              )

          },
          20000
        );


      if(
        !response
        ||
        response.ok !==
        true
      ){

        throw new Error(
          (
            response
            &&
            response.error
          )
          ||
          'No fue posible guardar la venta.'
        );

      }


      const number =
        reserveInvoiceNumber();


      const commercialName =
        String(
          INVOICE_CONFIG.nombreComercial
          ||
          currentBusiness
          ||
          'Negocios360'
        )
        .trim();


      lastInvoice = {

        numero:
          number,


        razonSocial:
          String(
            INVOICE_CONFIG.razonSocial
            ||
            commercialName
          ),


        nombreComercial:
          commercialName,


        rtn:
          String(
            INVOICE_CONFIG.rtn
            ||
            ''
          ),


        direccion:
          String(
            INVOICE_CONFIG.direccion
            ||
            ''
          ),


        telefono:
          String(
            INVOICE_CONFIG.telefono
            ||
            ''
          ),


        correo:
          String(
            INVOICE_CONFIG.correo
            ||
            ''
          ),


        cai:
          String(
            INVOICE_CONFIG.cai
            ||
            ''
          ),


        rangoDesde:
          String(
            INVOICE_CONFIG.rangoDesde
            ||
            ''
          ),


        rangoHasta:
          String(
            INVOICE_CONFIG.rangoHasta
            ||
            ''
          ),


        fechaLimite:
          String(
            INVOICE_CONFIG.fechaLimite
            ||
            ''
          ),


        fecha:
          response.fecha
          ||
          new Date()
            .toISOString(),


        fechaTexto:
          invoiceDateText(
            response.fecha
            ||
            new Date()
          ),


        cliente:
          'CONSUMIDOR FINAL',


        clienteRTN:
          '',


        items:
          saleItems.map(
            line => ({
              ...line
            })
          ),


        total:
          invoiceRound(
            total
          ),


        recibido:
          invoiceRound(
            received
          ),


        cambio:
          change

      };


      invoiceSaleCompleted =
        true;


      invalidateInventory();


      showInvoiceResult(
        lastInvoice
      );


      setStatus(
        'Venta guardada. Factura '
        +
        number
        +
        ' lista.'
      );

    }

    catch(error){

      console.error(
        error
      );


      setStatus(
        error.message
        ||
        'No fue posible guardar la venta.',
        true
      );


      if(
        finishButton
      ){

        finishButton.disabled =
          false;


        finishButton.textContent =
          'Confirmar pago';


        finishButton.style.opacity =
          '1';


        finishButton.style.cursor =
          'pointer';

      }


      document
        .getElementById(
          'cashReceived'
        )
        .focus();

    }

  };

/* ============================================================
 CARGAR HTML2CANVAS
 Convierte la factura visible en una imagen PNG.
 ============================================================ */

function loadInvoiceImageEngine(){

  if(
    window.html2canvas
  ){

    return Promise.resolve(
      window.html2canvas
    );

  }


  return new Promise(
    (
      resolve,
      reject
    ) => {

      const oldScript =
        document.querySelector(
          'script[data-invoice-html2canvas]'
        );


      if(
        oldScript
      ){

        oldScript.addEventListener(
          'load',
          () => {

            if(
              window.html2canvas
            ){

              resolve(
                window.html2canvas
              );

            }

            else{

              reject(
                new Error(
                  'No fue posible cargar el generador de imagen.'
                )
              );

            }

          }
        );


        oldScript.addEventListener(
          'error',
          () => {

            reject(
              new Error(
                'No fue posible cargar el generador de imagen.'
              )
            );

          }
        );


        return;

      }


      const script =
        document.createElement(
          'script'
        );


      script.src =
        'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';


      script.async =
        true;


      script.setAttribute(
        'data-invoice-html2canvas',
        'true'
      );


      script.onload =
        () => {

          if(
            window.html2canvas
          ){

            resolve(
              window.html2canvas
            );

          }

          else{

            reject(
              new Error(
                'No fue posible iniciar el generador de imagen.'
              )
            );

          }

        };


      script.onerror =
        () => {

          reject(
            new Error(
              'No fue posible cargar el generador de imagen.'
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/* ============================================================
 CREAR COPIA FIJA DE FACTURA

 La imagen SIEMPRE se genera a 440 px,
 independientemente del tamaño del celular.

 Así conservamos:
 Cant. | Ítem | Precio | Total
 siempre perfectamente alineados.
 ============================================================ */

function createInvoiceImageClone(){

  const preview =
    document.getElementById(
      'invoicePreview'
    );


  if(
    !preview
  ){

    throw new Error(
      'No se encontró la factura para generar la imagen.'
    );

  }


  const holder =
    document.createElement(
      'div'
    );


  holder.id =
    'invoiceImageHolder';


  holder.style.position =
    'fixed';


  holder.style.left =
    '-10000px';


  holder.style.top =
    '0';


  holder.style.width =
    '470px';


  holder.style.padding =
    '15px';


  holder.style.background =
    '#ffffff';


  holder.style.pointerEvents =
    'none';


  holder.style.zIndex =
    '-999999';


  const clone =
    preview.cloneNode(
      true
    );


  clone.removeAttribute(
    'id'
  );


  clone.classList.add(
    'invoice-image-render'
  );


  /*
   * Tamaño fijo.
   * Esto es lo que evita que WhatsApp
   * o un celular estrecho cambien el alineamiento.
   */

  clone.style.width =
    '440px';


  clone.style.minWidth =
    '440px';


  clone.style.maxWidth =
    '440px';


  clone.style.margin =
    '0';


  clone.style.padding =
    '17px';


  clone.style.background =
    '#ffffff';


  clone.style.borderRadius =
    '0';


  clone.style.boxShadow =
    'none';


  /*
   * Mantener tamaños de columnas exactos.
   */

  const table =
    clone.querySelector(
      '.invoice-table'
    );


  if(
    table
  ){

    table.style.width =
      '100%';


    table.style.tableLayout =
      'fixed';


    table.style.fontSize =
      '10px';

  }


  const headers =
    clone.querySelectorAll(
      '.invoice-table th'
    );


  const cells =
    clone.querySelectorAll(
      '.invoice-table td'
    );


  headers.forEach(
    (
      cell,
      index
    ) => {

      const column =
        index
        %
        4;


      if(
        column ===
        0
      ){

        cell.style.width =
          '35px';


        cell.style.textAlign =
          'center';

      }


      if(
        column ===
        1
      ){

        cell.style.textAlign =
          'left';

      }


      if(
        column ===
        2
      ){

        cell.style.width =
          '70px';


        cell.style.textAlign =
          'right';

      }


      if(
        column ===
        3
      ){

        cell.style.width =
          '74px';


        cell.style.textAlign =
          'right';

      }

    }
  );


  cells.forEach(
    (
      cell,
      index
    ) => {

      const column =
        index
        %
        4;


      if(
        column ===
        0
      ){

        cell.style.width =
          '35px';


        cell.style.textAlign =
          'center';

      }


      if(
        column ===
        1
      ){

        cell.style.textAlign =
          'left';

      }


      if(
        column ===
        2
      ){

        cell.style.width =
          '70px';


        cell.style.textAlign =
          'right';


        cell.style.whiteSpace =
          'nowrap';

      }


      if(
        column ===
        3
      ){

        cell.style.width =
          '74px';


        cell.style.textAlign =
          'right';


        cell.style.whiteSpace =
          'nowrap';

      }

    }
  );


  holder.appendChild(
    clone
  );


  document.body.appendChild(
    holder
  );


  return {

    holder:
      holder,

    invoice:
      clone

  };

}


/* ============================================================
 GENERAR PNG
 ============================================================ */

async function createInvoiceImageBlob(){

  /*
   * Recoger cambios hechos en Cliente / RTN.
   */

  updateInvoiceCustomer();


  await loadInvoiceImageEngine();


  const rendered =
    createInvoiceImageClone();


  try{

    /*
     * Esperar un cuadro de renderizado
     * antes de tomar la imagen.
     */

    await new Promise(
      resolve => {

        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              resolve
            );

          }
        );

      }
    );


    if(
      document.fonts
      &&
      document.fonts.ready
    ){

      try{

        await document.fonts.ready;

      }

      catch(_){
      }

    }


    /*
     * windowWidth 1200 evita que las reglas
     * responsive de celular cambien el diseño
     * de la factura al generar la imagen.
     */

    const canvas =
      await window.html2canvas(
        rendered.invoice,
        {

          backgroundColor:
            '#ffffff',

          scale:
            2,

          useCORS:
            true,

          allowTaint:
            false,

          logging:
            false,

          scrollX:
            0,

          scrollY:
            0,

          windowWidth:
            1200

        }
      );


    const blob =
      await new Promise(
        (
          resolve,
          reject
        ) => {

          canvas.toBlob(
            result => {

              if(
                result
              ){

                resolve(
                  result
                );

              }

              else{

                reject(
                  new Error(
                    'No fue posible crear la imagen de la factura.'
                  )
                );

              }

            },
            'image/png'
          );

        }
      );


    return blob;

  }

  finally{

    rendered.holder.remove();

  }

}

 NOMBRE ARCHIVO

function invoiceImageFileName(){

  const number =
    String(
      (
        lastInvoice
        &&
        lastInvoice.numero
      )
      ||
      'factura'
    )
    .replace(
      /[^0-9A-Za-z_-]/g,
      '-'
    );


  return (
    'Factura-'
    +
    number
    +
    '.png'
  );

}


/* ============================================================
 DESCARGAR IMAGEN COMO RESPALDO
 ============================================================ */

function downloadInvoiceImage(
  blob,
  fileName
){

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      'a'
    );


  link.href =
    url;


  link.download =
    fileName;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    3000
  );

}


/* ============================================================
 ENVIAR
 ============================================================ */

async function sendInvoice(){

  if(
    !lastInvoice
  ){

    setStatus(
      'No hay factura disponible.',
      true
    );


    return;

  }


  updateInvoiceCustomer();


  const sendButton =
    document.querySelector(
      '.invoice-action.send'
    );


  if(
    sendButton
  ){

    sendButton.disabled =
      true;


    sendButton.textContent =
      '🖼️ Generando imagen...';


    sendButton.style.opacity =
      '.65';

  }


  try{

    setStatus(
      'Preparando factura como imagen...'
    );


    /*
     * Crear exactamente la factura
     * que está viendo el usuario.
     */

    const blob =
      await createInvoiceImageBlob();


    const fileName =
      invoiceImageFileName();


    const file =
      new File(
        [
          blob
        ],
        fileName,
        {

          type:
            'image/png'

        }
      );


    /* ========================================================
       CELULAR

       Web Share API nivel 2 permite compartir
       directamente el archivo PNG.

       En Android/iPhone aparecerán:
       WhatsApp, correo, mensajes, etc.
       ======================================================== */

    if(
      navigator.share
      &&
      navigator.canShare
      &&
      navigator.canShare(
        {

          files:
            [
              file
            ]

        }
      )
    ){

      await navigator.share(
        {

          files:
            [
              file
            ]

        }
      );


      setStatus(
        'Factura compartida como imagen.'
      );


      return;

    }


    /* ========================================================
       COMPUTADORA

       Intentar copiar la IMAGEN al portapapeles.
       Luego puede pegarse directamente en WhatsApp Web.
       ======================================================== */

    if(
      navigator.clipboard
      &&
      navigator.clipboard.write
      &&
      window.ClipboardItem
    ){

      try{

        const clipboardItem =
          new ClipboardItem(
            {

              'image/png':
                blob

            }
          );


        await navigator.clipboard.write(
          [
            clipboardItem
          ]
        );


        setStatus(
          'Factura copiada como imagen. Ve a WhatsApp y presiona Ctrl + V.'
        );


        return;

      }

      catch(clipboardError){

        console.warn(
          'No fue posible copiar la imagen.',
          clipboardError
        );

      }

    }


    /* ========================================================
       RESPALDO

       Si el navegador no permite compartir archivos,
       descargamos el PNG.
       ======================================================== */

    downloadInvoiceImage(
      blob,
      fileName
    );


    setStatus(
      'Factura guardada como imagen. Adjunta el PNG en WhatsApp.'
    );

  }

  catch(error){

    if(
      error
      &&
      error.name ===
      'AbortError'
    ){

/* ============================================================
   REDONDEAR
   ============================================================ */

function isv360Round(
  value
){

  return Math.round(
    (
      Number(
        value
      )
      +
      Number.EPSILON
    )
    *
    100
  )
  /
  100;

}


/* ============================================================
   BUSCAR EL ITEM ORIGINAL EN MENU
   ============================================================ */

function isv360MenuItem(
  line
){

  if(
    !line
  ){

    return null;

  }


  if(
    line.id
  ){

    const byId =
      MENU.find(
        item =>
          item.id ===
          line.id
      );


    if(
      byId
    ){

      return byId;

    }

  }


  return (
    MENU.find(
      item =>

        String(
          item.negocio
          ||
          ''
        )
        .trim()
        ===
        String(
          currentBusiness
          ||
          ''
        )
        .trim()

        &&

        String(
          item.categoria
          ||
          ''
        )
        .trim()
        ===
        String(
          line.categoria
          ||
          ''
        )
        .trim()

        &&

        String(
          item.item
          ||
          ''
        )
        .trim()
        ===
        String(
          line.item
          ||
          ''
        )
        .trim()

    )
    ||
    null
  );

}


/* ============================================================
   ISV UNITARIO

   Menu:
   Valor = precio base
   isv15 = valor del impuesto 15% por unidad
   isv18 = valor del impuesto 18% por unidad

   Si hay descuento, el impuesto se ajusta
   proporcionalmente al nuevo precio.
   ============================================================ */

function isv360UnitTax(
  line,
  field
){

  const menuItem =
    isv360MenuItem(
      line
    );


  if(
    !menuItem
  ){

    return 0;

  }


  const configuredTax =
    Number(
      menuItem[
        field
      ]
    )
    ||
    0;


  if(
    configuredTax <=
    0
  ){

    return 0;

  }


  const originalPrice =
    Number(
      menuItem.valor
    )
    ||
    0;


  const salePrice =
    Number(
      line.valor
    )
    ||
    0;


  /*
   * Conservamos la misma proporción de impuesto
   * cuando existe descuento.
   */

  if(
    originalPrice >
    0
  ){

    return isv360Round(
      configuredTax
      *
      (
        salePrice
        /
        originalPrice
      )
    );

  }


  return isv360Round(
    configuredTax
  );

}


/* ============================================================
   IMPUESTOS DE UNA LINEA
   ============================================================ */

function isv360LineTaxes(
  line
){

  const quantity =
    Number(
      line.cantidad
    )
    ||
    0;


  const price =
    Number(
      line.valor
    )
    ||
    0;


  const base =
    isv360Round(
      quantity
      *
      price
    );


  let unit15 =
    isv360UnitTax(
      line,
      'isv15'
    );


  let unit18 =
    isv360UnitTax(
      line,
      'isv18'
    );


  /*
   * Un producto debe usar una tarifa.
   * Si accidentalmente las dos tienen valor,
   * damos prioridad al 18%.
   */

  if(
    unit18 >
    0
    &&
    unit15 >
    0
  ){

    unit15 =
      0;

  }


  const tax15 =
    isv360Round(
      quantity
      *
      unit15
    );


  const tax18 =
    isv360Round(
      quantity
      *
      unit18
    );


  return {

    base:
      base,

    isv15:
      tax15,

    isv18:
      tax18

  };

}


/* ============================================================
   RESUMEN FISCAL COMPLETO
   ============================================================ */

function isv360Summary(
  lines
){

  const result = {

    exento:
      0,

    exonerado:
      0,

    gravado15:
      0,

    isv15:
      0,

    gravado18:
      0,

    isv18:
      0,

    subtotal:
      0,

    total:
      0

  };


  (
    Array.isArray(
      lines
    )
    ?
    lines
    :
    []
  )
  .forEach(
    line => {

      const taxes =
        isv360LineTaxes(
          line
        );


      result.subtotal +=
        taxes.base;


      if(
        taxes.isv18 >
        0
      ){

        result.gravado18 +=
          taxes.base;


        result.isv18 +=
          taxes.isv18;

      }

      else if(
        taxes.isv15 >
        0
      ){

        result.gravado15 +=
          taxes.base;


        result.isv15 +=
          taxes.isv15;

      }

      else{

        /*
         * Con las columnas actuales,
         * 0 en 15% y 0 en 18% = EXENTO.
         */

        result.exento +=
          taxes.base;

      }

    }
  );


  result.exento =
    isv360Round(
      result.exento
    );


  result.exonerado =
    isv360Round(
      result.exonerado
    );


  result.gravado15 =
    isv360Round(
      result.gravado15
    );


  result.isv15 =
    isv360Round(
      result.isv15
    );


  result.gravado18 =
    isv360Round(
      result.gravado18
    );


  result.isv18 =
    isv360Round(
      result.isv18
    );


  result.subtotal =
    isv360Round(
      result.subtotal
    );


  result.total =
    isv360Round(

      result.subtotal

      +

      result.isv15

      +

      result.isv18

    );


  return result;

}


/* ============================================================
   TOTAL DE LA CUENTA

   Antes:
   cantidad × valor

   Ahora:
   subtotal + ISV15 + ISV18
   ============================================================ */

accountTotal =

/* ============================================================
   SOBRESCRIBIR IMPUESTOS DE FACTURA

   Ya no utiliza tratamientoFiscal fijo.
   Ahora manda lo configurado ITEM POR ITEM en Menu.
   ============================================================ */

/* ============================================================

const isv360ShowInvoiceBase =

showInvoiceResult =

/* ============================================================
   AGREGAR LOS IMPUESTOS AL JSON QUE VA A GS
   ============================================================ */

const isv360JsonpBase =
  jsonp;


jsonp =
  function(
    action,
    params = {},
    timeoutMs = 15000
  ){

    if(
      action ===
      'saveSale'
      &&
      params
      &&
      params.items
    ){

      try{

        const rows =
          JSON.parse(
            params.items
          );


        if(
          Array.isArray(
            rows
          )
        ){

          const enriched =
            rows.map(
              line => {

                const taxes =
                  isv360LineTaxes(
                    line
                  );


                return {

                  ...line,

                  /*
                   * Estos son TOTALES de impuesto
                   * por línea de venta.
                   */

                  isv15:
                    taxes.isv15,

                  isv18:
                    taxes.isv18

                };

              }
            );


          params = {

            ...params,

            items:
              JSON.stringify(
                enriched
              )

          };

        }

      }

      catch(error){

        console.error(
          'No fue posible agregar ISV a la venta.',
          error
        );

      }

    }


    return isv360JsonpBase(
      action,
      params,
      timeoutMs
    );

  };

    'n360PaymentStatus';


  box.className =
    'n360-payment-status';


  box.setAttribute(
    'role',
    'status'
  );


  box.setAttribute(
    'aria-live',
    'polite'
  );


  const actions =
    card.querySelector(
      '.payment-actions'
    );


  if(actions){

    actions.insertAdjacentElement(
      'beforebegin',
      box
    );

  }
  else{

    card.appendChild(
      box
    );

  }


  return box;

}


function n360PaymentMessage(
  message,
  error = false
){

  const box =
    n360EnsurePaymentStatus();


  if(!box){

    return;

  }


  box.textContent =
    String(
      message
      ||
      ''
    );


  box.classList.toggle(
    'show',
    Boolean(message)
  );


  box.classList.toggle(
    'error',
    Boolean(error)
  );

}


/* ============================================================
   EN PC DAR FOCO.
   EN CELULAR NO ABRIR TECLADO AUTOMATICAMENTE.
   ============================================================ */

function n360FocusCash(){

  if(
    n360IsMobile()
  ){

    return;

  }


  const input =
    document.getElementById(
      'cashReceived'
    );


  if(!input){

    return;

  }


  setTimeout(
    () => {

      try{

        input.focus({
          preventScroll:true
        });

      }
      catch(_){

        input.focus();

      }

    },
    80
  );

}


/* ============================================================
   ABRIR COBRO
   ============================================================ */

openCashPayment =
function(){


  if(
    typeof installInvoiceUI ===
      'function'
  ){

    installInvoiceUI();

  }


  if(
    typeof resetInvoicePaymentUI ===
      'function'
  ){

    resetInvoicePaymentUI();

  }


  cashEntry =
    '';


  const overlay =
    document.getElementById(
      'cashPaymentOverlay'
    );


  const totalElement =
    document.getElementById(
      'paymentTotal'
    );


  const input =
    document.getElementById(
      'cashReceived'
    );


  if(
    !overlay
    ||
    !totalElement
    ||
    !input
  ){

    setStatus(
      'No fue posible abrir la ventana de cobro.',
      true
    );

    return;

  }


  totalElement.textContent =
    money(
      accountTotal()
    );


  input.value =
    '';


  updateCashChange();


  overlay
    .classList
    .add(
      'show'
    );


  document.body.style.overflow =
    'hidden';


  n360PaymentMessage(
    ''
  );


  /*
   * Mostrar detalle ISV.
   */

  if(
    typeof isv360RenderPaymentSummary ===
      'function'
  ){

    isv360RenderPaymentSummary();

  }


  const card =
    overlay.querySelector(
      '.cash-payment-card'
    );


  if(card){

    card.scrollTop =
      0;

  }


  /*
   * CELULAR:
   * no abrir automáticamente el teclado.
   */

  if(
    n360IsMobile()
  ){

    try{

      input.blur();

    }
    catch(_){}

  }
  else{

    n360FocusCash();

  }

};


/* ============================================================
   CONFIRMAR PAGO Y GENERAR FACTURA
   ============================================================ */

finishCashPayment =
async function(){


  const state =
    window.N360PaymentState;


  if(
    state.saving
    ||
    (
      typeof invoiceSaleCompleted !==
        'undefined'
      &&
      invoiceSaleCompleted
    )
  ){

    return;

  }


  const received =
    Number(
      cashEntry
      ||
      0
    );


  const total =
    Number(
      accountTotal()
    )
    ||
    0;


  if(
    received <
    total
  ){

    const message =
      'El efectivo recibido es menor que el total.';


    setStatus(
      message,
      true
    );


    n360PaymentMessage(
      message,
      true
    );


    n360FocusCash();


    return;

  }


  if(
    !Array.isArray(accountLines)
    ||
    !accountLines.length
  ){

    const message =
      'No hay productos para guardar.';


    setStatus(
      message,
      true
    );


    n360PaymentMessage(
      message,
      true
    );


    return;

  }


  const change =
    typeof invoiceRound ===
      'function'
    ?
    invoiceRound(
      received -
      total
    )
    :
    Math.round(
      (
        received -
        total
      )
      *
      100
    )
    /
    100;


  const button =
    document.querySelector(
      '.payment-action.finish'
    );


  state.saving =
    true;


  if(button){

    button.disabled =
      true;

    button.textContent =
      'Guardando...';

    button.style.opacity =
      '.65';

  }


  /*
   * CREAR PRODUCTOS
   */

  const saleItems =
    accountLines.map(
      line => {


        let tax15 =
          0;


        let tax18 =
          0;


        /*
         * Mandamos impuestos calculados.
         */

        if(
          typeof isv360LineTaxes ===
            'function'
        ){

          const taxes =
            isv360LineTaxes(
              line
            );


          tax15 =
            Number(
              taxes.isv15
            )
            ||
            0;


          tax18 =
            Number(
              taxes.isv18
            )
            ||
            0;

        }


        return {

          categoria:
            String(
              line.categoria
              ||
              ''
            ),


          cantidad:
            Number(
              line.cantidad
            )
            ||
            0,


          item:
            String(
              line.item
              ||
              ''
            ),


          valor:
            Number(
              line.valor
            )
            ||
            0,


          isv15:
            tax15,


          isv18:
            tax18

        };

      }
    );


  /*
   * ID DE ESTA VENTA
   */

  const payload =
    JSON.stringify(
      saleItems
    );


  if(
    !state.saleId
    ||
    state.payload !==
      payload
  ){

    state.saleId =
      n360CreateSaleId();


    state.payload =
      payload;

  }


  try{


    const savingMessage =
      'Guardando venta y actualizando inventario...';


    setStatus(
      savingMessage
    );


    n360PaymentMessage(
      savingMessage
    );


    /*
     * ENVIAR A APPS SCRIPT
     *
     * 60 segundos:
     * celular puede tardar más que PC.
     */

    const response =
      await jsonp(

        'saveSale',

        {

          items:
            JSON.stringify(
              saleItems
            ),


          saleId:
            state.saleId,


          rangoDesde:
            String(
              INVOICE_CONFIG.rangoDesde
              ||
              ''
            ),


          rangoHasta:
            String(
              INVOICE_CONFIG.rangoHasta
              ||
              ''
            )

        },

        60000

      );


    if(
      !response
      ||
      response.ok !==
        true
    ){

      throw new Error(

        (
          response
          &&
          response.error
        )

        ||

        'No fue posible guardar la venta.'

      );

    }


    /*
     * NUMERO FACTURA
     */

    const number =

      response.invoiceNumber

      ?

      String(
        response.invoiceNumber
      )

      :

      reserveInvoiceNumber();


    const commercialName =
      String(

        INVOICE_CONFIG.nombreComercial

        ||

        currentBusiness

        ||

        'Negocios360'

      )
      .trim();


    /*
     * CREAR FACTURA
     */

    lastInvoice = {

      numero:
        number,


      razonSocial:
        String(
          INVOICE_CONFIG.razonSocial
          ||
          commercialName
        ),


      nombreComercial:
        commercialName,


      rtn:
        String(
          INVOICE_CONFIG.rtn
          ||
          ''
        ),


      direccion:
        String(
          INVOICE_CONFIG.direccion
          ||
          ''
        ),


      telefono:
        String(
          INVOICE_CONFIG.telefono
          ||
          ''
        ),


      correo:
        String(
          INVOICE_CONFIG.correo
          ||
          ''
        ),


      cai:
        String(
          INVOICE_CONFIG.cai
          ||
          ''
        ),


      rangoDesde:
        String(
          INVOICE_CONFIG.rangoDesde
          ||
          ''
        ),


      rangoHasta:
        String(
          INVOICE_CONFIG.rangoHasta
          ||
          ''
        ),


      fechaLimite:
        String(
          INVOICE_CONFIG.fechaLimite
          ||
          ''
        ),


      fecha:
        response.fecha
        ||
        new Date()
          .toISOString(),


      fechaTexto:
        invoiceDateText(
          response.fecha
          ||
          new Date()
        ),


      cliente:
        'CONSUMIDOR FINAL',


      clienteRTN:
        '',


      items:
        saleItems.map(
          item => ({
            ...item
          })
        ),


      total:
        invoiceRound(
          total
        ),


      recibido:
        invoiceRound(
          received
        ),


      cambio:
        change

    };


    invoiceSaleCompleted =
      true;


    invalidateInventory();


    n360PaymentMessage(
      ''
    );


    /*
     * MOSTRAR FACTURA
     */

    showInvoiceResult(
      lastInvoice
    );


    setStatus(

      'Venta guardada. Factura '

      +

      number

      +

      ' lista.'

    );


    /*
     * CELULAR:
     * desplazarse hasta la factura.
     */

    const card =
      document.querySelector(
        '.cash-payment-card'
      );


    if(card){

      requestAnimationFrame(
        () => {

          try{

            card.scrollTo({

              top:0,

              behavior:
                n360IsMobile()
                ?
                'auto'
                :
                'smooth'

            });

          }
          catch(_){

            card.scrollTop =
              0;

          }

        }
      );

    }


    /*
     * Venta finalizada.
     */

    state.saleId =
      '';


    state.payload =
      '';


  }
  catch(error){


    console.error(
      error
    );


    const message =
      (
        error
        &&
        error.message
      )
      ||
      'No fue posible guardar la venta.';


    setStatus(
      message,
      true
    );


    n360PaymentMessage(
      message,
      true
    );


    /*
     * No eliminamos saleId.
     *
     * Si el celular perdió únicamente
     * la respuesta, puede volver a
     * Confirmar pago sin duplicar.
     */

    n360FocusCash();


  }
  finally{


    state.saving =
      false;


    if(
      button
      &&
      !invoiceSaleCompleted
    ){

      button.disabled =
        false;


      button.textContent =
        'Confirmar pago';


      button.style.opacity =
        '1';


      button.style.cursor =
        'pointer';

    }

  }

};


})();

</script>
