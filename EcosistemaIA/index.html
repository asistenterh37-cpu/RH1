<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ecosistema Automatizado con IA</title>

<style>

/* ==================================================
   VARIABLES
================================================== */

:root{
    --bg1:#07111f;
    --bg2:#0f2f68;
    --stroke:rgba(255,255,255,.28);
    --text:#ffffff;
    --muted:#dbeafe;
    --blue:#2563eb;
    --cyan:#06b6d4;
    --green:#10b981;
    --purple:#7c3aed;
    --red:#ef4444;
}


/* ==================================================
   GENERAL
================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;

    font-family:"Segoe UI", Arial, sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at top left,
            rgba(124,58,237,.45),
            transparent 32%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(6,182,212,.35),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--bg1),
            var(--bg2),
            #111827
        );
}


body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.04) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    opacity:.45;

    pointer-events:none;

    z-index:0;
}


/* ==================================================
   CONTENEDOR PRINCIPAL
================================================== */

.hero{

    height:100vh;

    padding:18px 26px;

    display:flex;

    flex-direction:column;

    position:relative;

    z-index:1;
}


/* ==================================================
   BARRA SUPERIOR
================================================== */

.topbar{

    height:74px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:16px;

    padding:10px 14px;

    border:1px solid var(--stroke);

    background:rgba(255,255,255,.10);

    backdrop-filter:blur(24px);

    border-radius:24px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.25);

    position:relative;

    z-index:20;
}


/* ==================================================
   MARCA
================================================== */

.brand{

    display:flex;

    align-items:center;

    gap:12px;

    min-width:180px;
}


.logo{

    width:44px;

    height:44px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    font-weight:900;

    box-shadow:
        0 12px 28px rgba(0,0,0,.35);
}


.brand span{

    font-size:14px;

    color:var(--muted);

    line-height:1.2;
}


/* ==================================================
   ENCABEZADO
================================================== */

.header{

    text-align:center;

    flex:1;
}


.header h1{

    margin:0;

    font-size:36px;

    font-weight:900;

    letter-spacing:1px;
}


.header p{

    margin:4px 0 0;

    font-size:15px;

    color:var(--muted);
}


.subheader{

    margin-top:8px;

    font-size:14px;

    font-weight:700;

    letter-spacing:1px;

    color:#8DEBFF;

    text-transform:uppercase;
}


/* ==================================================
   BOTONES SUPERIORES
================================================== */

.acciones{

    display:flex;

    gap:10px;

    justify-content:flex-end;

    min-width:260px;
}


.btn-top{

    border:none;

    color:white;

    padding:12px 17px;

    border-radius:16px;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    background:rgba(255,255,255,.14);

    border:1px solid rgba(255,255,255,.22);

    backdrop-filter:blur(18px);

    box-shadow:
        0 10px 28px rgba(0,0,0,.25);

    transition:.25s;
}


.btn-top:hover{

    transform:translateY(-2px);

    background:rgba(255,255,255,.22);
}


.btn-rompecabezas{

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.92),
            rgba(37,99,235,.92)
        );
}


.btn-volver{

    background:
        linear-gradient(
            135deg,
            rgba(15,23,42,.8),
            rgba(51,65,85,.8)
        );
}


/* ==================================================
   ECOSISTEMA
================================================== */

.ecosistema{

    flex:1;

    margin-top:15px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    grid-template-rows:repeat(4,1fr);

    gap:13px;

    min-height:0;
}


/* ==================================================
   BOTONES MÓDULOS
================================================== */

.modulo{

    border:1px solid rgba(255,255,255,.25);

    color:white;

    padding:18px;

    border-radius:22px;

    font-size:24px;

    line-height:1.25;

    font-weight:900;

    letter-spacing:.3px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.08)
        ),
        linear-gradient(
            135deg,
            rgba(37,99,235,.75),
            rgba(16,185,129,.65)
        );

    backdrop-filter:blur(22px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 18px 40px rgba(0,0,0,.26);

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    min-height:95px;

    transition:.25s;
}


.modulo:hover{

    transform:
        translateY(-5px)
        scale(1.015);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.10)
        ),
        linear-gradient(
            135deg,
            rgba(124,58,237,.86),
            rgba(6,182,212,.78)
        );
}


/* ==================================================
   CENTRO RH ONE AI
================================================== */

.centro{

    grid-column:2 / 4;

    grid-row:2 / 4;

    border:
        1px solid rgba(255,255,255,.32);

    background:
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(30px);

    border-radius:34px;

    padding:22px 26px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

    min-height:0;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 30px 80px rgba(0,0,0,.35);
}


.centro .badge{

    width:max-content;

    margin:0 auto 12px;

    padding:9px 16px;

    border-radius:999px;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.24);

    color:#dbeafe;

    font-weight:800;

    font-size:14px;
}


.centro h2{

    margin:0 0 12px;

    font-size:56px;

    font-weight:900;

    letter-spacing:1px;

    color:white;
}


.centro p{

    margin:0 auto;

    max-width:760px;

    font-size:18px;

    line-height:1.45;

    color:#e0f2fe;
}


/* ==================================================
   TEST MADUREZ
================================================== */

.btn-madurez{

    display:inline-block;

    margin:8px auto 14px;

    padding:14px 28px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #10b981
        );

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:800;

    letter-spacing:.5px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);

    transition:.3s;
}


.btn-madurez:hover{

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 18px 35px rgba(0,0,0,.45);

    background:
        linear-gradient(
            135deg,
            #10b981,
            #2563eb
        );
}


/* ==================================================
   PANEL MÓDULOS
================================================== */

.panel{

    display:none;

    position:fixed;

    inset:105px 26px 24px 26px;

    color:#0f172a;

    border-radius:30px;

    overflow:hidden;

    z-index:600;

    background:rgba(255,255,255,.78);

    backdrop-filter:blur(34px);

    border:1px solid rgba(255,255,255,.55);

    box-shadow:
        0 35px 90px rgba(0,0,0,.45);
}


.panel.activo{

    display:grid;

    grid-template-rows:76px 1fr;
}


.panel-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:18px 24px;

    background:
        linear-gradient(
            135deg,
            rgba(7,17,31,.92),
            rgba(37,99,235,.84)
        );

    color:white;
}


.panel-header h2{

    margin:0;

    font-size:28px;
}


.cerrar{

    background:rgba(239,68,68,.9);

    border:none;

    color:white;

    padding:10px 16px;

    border-radius:14px;

    cursor:pointer;

    font-weight:800;

    font-size:15px;
}


.panel-body{

    min-height:0;

    display:grid;

    grid-template-columns:300px 1fr;
}


.menu{

    min-height:0;

    overflow:auto;

    padding:18px;

    background:rgba(219,234,254,.65);

    border-right:
        1px solid rgba(148,163,184,.45);
}


.menu button{

    display:block;

    width:100%;

    margin-bottom:10px;

    padding:13px 14px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

    color:white;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    text-align:left;

    box-shadow:
        0 8px 20px rgba(37,99,235,.25);
}


.contenido{

    min-height:0;

    padding:20px;

    overflow:hidden;
}


.descripcion-card{

    height:100%;

    overflow:auto;

    padding:24px;

    border-radius:24px;

    background:rgba(255,255,255,.82);

    border:
        1px solid rgba(148,163,184,.35);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85);
}


.descripcion-card h3{

    margin:0 0 14px;

    color:#1d4ed8;

    font-size:25px;
}


.descripcion-card p{

    margin:0;

    font-size:19px;

    line-height:1.62;

    text-align:justify;

    color:#1f2937;
}


/* ==================================================
   MENÚ DE ROMPECABEZAS

   CAMBIO:
   ahora se abre agregando la clase .abierto
================================================== */

.puzzle-menu{

    display:none;

    position:fixed;

    top:96px;

    right:36px;

    z-index:1500;

    padding:12px;

    border-radius:20px;

    background:rgba(255,255,255,.96);

    backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.65);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45);
}


/* ESTA CLASE ABRE EL MENÚ */

.puzzle-menu.abierto{

    display:block !important;
}


.puzzle-menu button{

    display:block;

    width:180px;

    margin:8px 0;

    padding:13px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}


.puzzle-menu button:hover{

    transform:translateY(-2px);

    filter:brightness(1.1);
}


/* ==================================================
   MODAL ROMPECABEZAS

   CAMBIO IMPORTANTE:
   se abre con la clase .activo
================================================== */

.puzzle-modal{

    display:none;

    position:fixed;

    inset:0;

    width:100vw;

    height:100vh;

    background:rgba(2,6,23,.82);

    z-index:99999;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* ESTA CLASE MUESTRA EL ROMPECABEZAS */

.puzzle-modal.activo{

    display:flex !important;
}


.puzzle-card{

    width:min(92vw,540px);

    max-height:94vh;

    overflow:auto;

    padding:24px;

    text-align:center;

    border-radius:28px;

    background:rgba(255,255,255,.97);

    color:#111827;

    border:1px solid rgba(255,255,255,.65);

    box-shadow:
        0 35px 90px rgba(0,0,0,.65);

    position:relative;
}


.puzzle-card h2{

    margin:8px 0 5px;

    color:#111827;

    font-size:28px;
}


#nivelTexto{

    margin:7px 0;

    color:#475569;

    font-size:18px;

    font-weight:800;
}


.cerrar-puzzle{

    position:absolute;

    top:14px;

    right:14px;

    background:#ef4444;

    color:white;

    border:none;

    padding:9px 14px;

    border-radius:12px;

    cursor:pointer;

    font-weight:800;
}


.cerrar-puzzle:hover{

    background:#dc2626;
}


/* ==================================================
   CRONÓMETRO
================================================== */

.cronometro-puzzle{

    margin:14px auto 12px;

    padding:10px 16px;

    width:max-content;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:20px;

    font-weight:900;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}


/* ==================================================
   TABLERO
================================================== */

.puzzle-board{

    margin:18px auto 0;

    display:grid;

    gap:7px;

    width:min(72vw,390px);

    height:min(72vw,390px);

    max-width:390px;

    max-height:390px;

    touch-action:manipulation;
}


.tile{

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #10b981
        );

    color:white;

    font-size:25px;

    font-weight:900;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    touch-action:manipulation;

    box-shadow:
        0 9px 18px rgba(0,0,0,.22);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}


.tile:hover{

    transform:scale(1.035);

    box-shadow:
        0 12px 24px rgba(0,0,0,.30);
}


.tile.empty{

    background:#e5e7eb;

    box-shadow:
        inset 0 2px 8px rgba(0,0,0,.12);

    cursor:default;

    transform:none;
}


/* ==================================================
   ORDEN ECOSISTEMA
================================================== */

/* FILA SUPERIOR */

.modulo:nth-of-type(1){
    grid-column:1;
    grid-row:1;
}

.modulo:nth-of-type(2){
    grid-column:2;
    grid-row:1;
}

.modulo:nth-of-type(3){
    grid-column:3;
    grid-row:1;
}

.modulo:nth-of-type(4){
    grid-column:4;
    grid-row:1;
}


/* LADO DERECHO */

.modulo:nth-of-type(5){
    grid-column:4;
    grid-row:2;
}

.modulo:nth-of-type(6){
    grid-column:4;
    grid-row:3;
}


/* ABAJO */

.modulo:nth-of-type(7){
    grid-column:4;
    grid-row:4;
}

.modulo:nth-of-type(8){
    grid-column:3;
    grid-row:4;
}

.modulo:nth-of-type(9){
    grid-column:2;
    grid-row:4;
}

.modulo:nth-of-type(10){
    grid-column:1;
    grid-row:4;
}


/* IZQUIERDA */

.modulo:nth-of-type(11){
    grid-column:1;
    grid-row:3;
}

.modulo:nth-of-type(12){
    grid-column:1;
    grid-row:2;
}


/* ==================================================
   BOTÓN MÓVIL
================================================== */

.btn-puzzle-mobile{

    display:none;
}


/* ==================================================
   CELULAR
================================================== */

@media(max-width:650px){


    html,
    body{

        width:100%;

        min-height:100%;

        overflow-x:hidden;

        overflow-y:auto;
    }


    .hero{

        height:auto;

        min-height:100vh;

        padding:10px;
    }


    .topbar{

        display:none;
    }


    .btn-puzzle-mobile{

        display:flex;

        justify-content:center;

        align-items:center;

        width:100%;

        min-height:66px;

        margin-bottom:10px;

        border:none;

        border-radius:18px;

        cursor:pointer;

        color:white;

        font-size:18px;

        font-weight:900;

        background:
            linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );
    }


    .ecosistema{

        display:flex;

        flex-direction:column;

        gap:10px;

        margin-top:0;
    }


    .centro{

        order:-1;

        width:100%;

        grid-column:auto;

        grid-row:auto;

        padding:22px 14px;

        border-radius:24px;
    }


    .centro .badge{

        width:auto;

        max-width:100%;

        font-size:12px;
    }


    .centro h2,
    .centro h2[style]{

        font-size:34px !important;

        margin:0 0 8px !important;
    }


    .centro p,
    .centro p[style]{

        font-size:15px !important;

        line-height:1.4 !important;
    }


    .centro p:last-child{

        font-size:17px !important;

        font-weight:900;
    }


    .modulo{

        width:100%;

        min-height:74px;

        font-size:18px;

        border-radius:18px;

        padding:14px;
    }


    .panel{

        inset:10px 8px 8px 8px;

        border-radius:18px;
    }


    .panel.activo{

        grid-template-rows:62px 1fr;
    }


    .panel-header{

        padding:12px;
    }


    .panel-header h2{

        font-size:19px;
    }


    .panel-body{

        grid-template-columns:1fr;
    }


    .menu{

        max-height:170px;

        padding:12px;
    }


    .contenido{

        padding:12px;
    }


    .descripcion-card{

        padding:16px;
    }


    .descripcion-card p{

        font-size:16px;

        text-align:left;
    }


    .puzzle-menu{

        top:76px;

        left:12px;

        right:12px;

        width:auto;
    }


    .puzzle-menu button{

        width:100%;
    }


    .puzzle-modal{

        padding:10px;
    }


    .puzzle-card{

        width:96vw;

        padding:
            52px 14px 18px;
    }


    .puzzle-board{

        width:min(88vw,390px);

        height:min(88vw,390px);
    }


    .tile{

        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- =================================================
     ECOSISTEMA PRINCIPAL
================================================== -->

<section class="hero">


    <!-- BARRA SUPERIOR -->

    <div class="topbar">


        <div class="brand">

            <div class="logo">
                AI
            </div>

            <span>
                Soluciones automatizadas<br>
                de Recursos Humanos
            </span>

        </div>


        <div class="header">

            <h1>
                Ecosistema automatizado + IA
            </h1>

            <p class="subheader">
                Automatización • IA • Analytics • Dashboards
            </p>

        </div>


        <div class="acciones">


            <button
                type="button"
                class="btn-top btn-volver"
                id="btnVolver"
            >
                ← Volver
            </button>


            <button
                type="button"
                class="btn-top btn-rompecabezas"
                id="btnPuzzleDesktop"
            >
                🧩 Rompecabezas
            </button>


        </div>


    </div>


    <!-- BOTÓN ROMPECABEZAS EN CELULAR -->

    <button
        type="button"
        class="btn-puzzle-mobile"
        id="btnPuzzleMobile"
    >
        🧩 Rompecabezas
    </button>


    <!-- MENÚ DE NIVELES -->

    <div
        class="puzzle-menu"
        id="puzzleMenu"
    >


        <button
            type="button"
            class="nivel-puzzle"
            data-size="3"
        >
            Nivel 3x3
        </button>


        <button
            type="button"
            class="nivel-puzzle"
            data-size="4"
        >
            Nivel 4x4
        </button>


        <button
            type="button"
            class="nivel-puzzle"
            data-size="5"
        >
            Nivel 5x5
        </button>


    </div>


    <!-- ECOSISTEMA -->

    <div
        class="ecosistema"
        id="botones"
    ></div>


    <!-- PANEL INFORMACIÓN -->

    <div
        id="panel"
        class="panel"
    >


        <div class="panel-header">

            <h2 id="tituloModulo"></h2>

            <button
                type="button"
                class="cerrar"
                id="btnCerrarPanel"
            >
                Cerrar
            </button>

        </div>


        <div class="panel-body">


            <div
                class="menu"
                id="menuModulo"
            ></div>


            <div class="contenido">


                <div class="descripcion-card">


                    <h3>
                        Descripción del módulo
                    </h3>


                    <p id="descripcionModulo"></p>


                </div>


            </div>


        </div>


    </div>


</section>


<!-- =================================================
     ROMPECABEZAS

     IMPORTANTE:
     Ahora está FUERA de .hero para evitar cualquier
     problema de capas / stacking context.
================================================== -->

<div
    class="puzzle-modal"
    id="puzzleModal"
    aria-hidden="true"
>


    <div
        class="puzzle-card"
        id="puzzleCard"
    >


        <button
            type="button"
            class="cerrar-puzzle"
            id="btnCerrarPuzzle"
        >
            Cerrar
        </button>


        <h2>
            Rompecabezas deslizante
        </h2>


        <p id="nivelTexto">

/* ==================================================
   CREAR TABLERO

   Siempre partimos de un tablero resuelto y
   lo mezclamos con movimientos legales.

   Esto garantiza que TODOS los puzzles
   tengan solución.
================================================== */

function crearPuzzle(size){


    const total =
        size * size;


    tiles = [];


    /*
        1, 2, 3...
    */

    for(
        let i = 1;
        i < total;
        i++
    ){

        tiles.push(i);

    }


    /*
        Último espacio vacío.
    */

    tiles.push("");


    /*
        Mezcla.
    */

    let movimientos;


    if(size === 3){

        movimientos = 100;

    }
    else if(size === 4){

        movimientos = 180;

    }
    else{

        movimientos = 280;

    }


    barajarPuzzle(
        movimientos
    );


    /*
        Si por pura casualidad queda resuelto,
        hacemos un movimiento legal.
    */

    if(estaResuelto()){


        const vacio =
            tiles.indexOf("");


        const vecinos =
            obtenerVecinos(vacio);


        if(vecinos.length){


            intercambiar(
                vacio,
                vecinos[0]
            );

        }

    }


    dibujarPuzzle();

}


/* ==================================================
   OBTENER MOVIMIENTOS POSIBLES
================================================== */

function obtenerVecinos(indiceVacio){


    const fila =
        Math.floor(
            indiceVacio /
            puzzleSize
        );


    const columna =
        indiceVacio %
        puzzleSize;


    const vecinos = [];


    /* ARRIBA */

    if(fila > 0){

        vecinos.push(
            indiceVacio -
            puzzleSize
        );

    }


    /* ABAJO */

    if(
        fila <
        puzzleSize - 1
    ){

        vecinos.push(
            indiceVacio +
            puzzleSize
        );

    }


    /* IZQUIERDA */

    if(columna > 0){

        vecinos.push(
            indiceVacio - 1
        );

    }


    /* DERECHA */

    if(
        columna <
        puzzleSize - 1
    ){

        vecinos.push(
            indiceVacio + 1
        );

    }


    return vecinos;

}


/* ==================================================
   INTERCAMBIAR
================================================== */

function intercambiar(a,b){


    const temporal =
        tiles[a];


    tiles[a] =
        tiles[b];


    tiles[b] =
        temporal;

}


/* ==================================================
   BARAJAR
================================================== */

function barajarPuzzle(cantidad){


    let posicionAnterior =
        -1;


    for(
        let movimiento = 0;
        movimiento < cantidad;
        movimiento++
    ){


        const vacio =
            tiles.indexOf("");


        let vecinos =
            obtenerVecinos(vacio);


        /*
            No regresar inmediatamente
            al movimiento anterior.
        */

        if(
            posicionAnterior !== -1 &&
            vecinos.length > 1
        ){


            const filtrados =
                vecinos.filter(

                    indice =>
                    indice !== posicionAnterior

                );


            if(filtrados.length){

                vecinos =
                    filtrados;

            }

        }


        const posicionAleatoria =
            Math.floor(
                Math.random() *
                vecinos.length
            );


        const destino =
            vecinos[
                posicionAleatoria
            ];


        posicionAnterior =
            vacio;


        intercambiar(
            vacio,
            destino
        );

    }

}


/* ==================================================
   DIBUJAR TABLERO
================================================== */

function dibujarPuzzle(){


    puzzleBoard.innerHTML =
        "";


    puzzleBoard.style.gridTemplateColumns =
        `repeat(${puzzleSize}, 1fr)`;


    puzzleBoard.style.gridTemplateRows =
        `repeat(${puzzleSize}, 1fr)`;


    tiles.forEach(

                ficha.disabled =

                ficha.setAttribute(
                    "aria-label",
                    "Espacio vacío"
                );


            }
            else{


                ficha.className =
                    "tile";


                ficha.textContent =
                    valor;


                ficha.addEventListener(
                    "click",
                    ()=> moverFicha(indice)
                );

            }


            puzzleBoard.appendChild(
                ficha
            );

        }
    );

}


/* ==================================================
   MOVER FICHA
================================================== */

function moverFicha(indice){


    if(!puzzleEnJuego){

        return;

    }


    const vacio =
        tiles.indexOf("");


    const filaFicha =
        Math.floor(
            indice /
            puzzleSize
        );


    const columnaFicha =
        indice %
        puzzleSize;


    const filaVacio =
        Math.floor(
            vacio /
            puzzleSize
        );


    const columnaVacio =
        vacio %
        puzzleSize;


    const distancia =
        Math.abs(
            filaFicha -
            filaVacio
        )
        +
        Math.abs(
            columnaFicha -
            columnaVacio
        );


    /*
        Solo puede moverse una ficha vecina.
    */

    if(distancia !== 1){

        return;

    }


    intercambiar(
        indice,
        vacio
    );


    dibujarPuzzle();


    /*
        Revisar victoria.
    */

    if(estaResuelto()){


        puzzleEnJuego =
            false;


        detenerCronometro();


        const tiempo =
            tiempoPuzzle.textContent;


        /*
            Dejar renderizar la última ficha.
        */

        window.setTimeout(
            ()=>{


                alert(
                    `¡Ganaste! Tiempo de solución: ${tiempo} 🧩`
                );


            },
            120
        );

    }

}


/* ==================================================
   VALIDAR VICTORIA
================================================== */

function estaResuelto(){


    const total =
        puzzleSize *
        puzzleSize;


    for(
        let i = 0;
        i < total - 1;
        i++
    ){


        if(
            tiles[i] !==
            i + 1
        ){

            return false;

        }

    }


    return (
        tiles[total - 1] === ""
    );

}


/* ==================================================
   CRONÓMETRO
================================================== */

function iniciarCronometro(){


    detenerCronometro();


    tiempoInicioPuzzle =
        Date.now();


    tiempoPuzzle.textContent =
        "00:00";


    intervaloPuzzle =

}


function actualizarCronometro(){


    if(!puzzleEnJuego){

        return;

    }


    const transcurrido =
        Math.floor(
            (
                Date.now() -
                tiempoInicioPuzzle
            )
            /
            1000
        );


    const minutos =
        Math.floor(
            transcurrido /
            60
        );


    const segundos =
        transcurrido %
        60;


    tiempoPuzzle.textContent =

        String(minutos)
        .padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(segundos)
        .padStart(
            2,
            "0"
        );

}


function detenerCronometro(){


    if(
        intervaloPuzzle !== null
    ){


        clearInterval(
            intervaloPuzzle
        );


        intervaloPuzzle =
            null;

    }

}

            );


        if(
            !clicDentroMenu &&
            !clicDesktop &&
            !clicMobile
        ){

            cerrarPuzzleMenu();

        }

    }
);


/* ==================================================
   CERRAR ROMPECABEZAS AL HACER CLIC EN FONDO
================================================== */

puzzleModal.addEventListener(
    "click",
    function(event){


        /*
            Solo cerrar si se pulsó el fondo oscuro,
            NO la tarjeta.
        */

        if(
            event.target ===
            puzzleModal
        ){

            cerrarPuzzle();

        }

    }
);


/* Evitar propagación desde la tarjeta */

puzzleCard.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

    }
);


/* ==================================================
   ESC
================================================== */

document.addEventListener(
    "keydown",
    function(event){


        if(
            event.key !==
            "Escape"
        ){

            return;

        }


        /*
            Primero cerrar puzzle.
        */

        if(
            puzzleModal
            .classList
            .contains("activo")
        ){


            cerrarPuzzle();

            return;

        }


        /*
            Luego menú.
        */

        if(
            puzzleMenu
            .classList
            .contains("abierto")
        ){


            cerrarPuzzleMenu();

            return;

        }


        /*
            Finalmente panel de módulos.
        */

        cerrarPanel();

    }
);

   PRUEBA DE INICIALIZACIÓN
================================================== */

console.log(
    "RH One AI cargado correctamente."
);

console.log(
    "Rompecabezas disponible: 3x3, 4x4 y 5x5."
);
