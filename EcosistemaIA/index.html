<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ecosistema Automatizado con IA</title>

<style>

:root{
    --bg1:#07111f;
    --bg2:#0f2f68;
    --stroke:rgba(255,255,255,.28);
    --text:#ffffff;
    --muted:#dbeafe;
    --blue:#2563eb;
    --cyan:#06b6d4;
    --green:#10b981;
    --purple:#7c3aed;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;

    font-family:"Segoe UI", Arial, sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at top left,
            rgba(124,58,237,.45),
            transparent 32%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(6,182,212,.35),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--bg1),
            var(--bg2),
            #111827
        );
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.04) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    opacity:.45;

    pointer-events:none;
}


/* ==================================================
   CONTENEDOR PRINCIPAL
================================================== */

.hero{

    height:100vh;

    padding:18px 26px;

    display:flex;

    flex-direction:column;

    position:relative;
}


/* ==================================================
   BARRA SUPERIOR
================================================== */

.topbar{

    height:74px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:16px;

    padding:10px 14px;

    border:1px solid var(--stroke);

    background:rgba(255,255,255,.10);

    backdrop-filter:blur(24px);

    border-radius:24px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.25);

    z-index:20;
}


/* ==================================================
   MARCA
================================================== */

.brand{

    display:flex;

    align-items:center;

    gap:12px;

    min-width:180px;
}

.logo{

    width:44px;

    height:44px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    font-weight:900;

    box-shadow:
        0 12px 28px rgba(0,0,0,.35);
}

.brand span{

    font-size:14px;

    color:var(--muted);

    line-height:1.2;
}


/* ==================================================
   ENCABEZADO
================================================== */

.header{

    text-align:center;

    flex:1;
}

.header h1{

    margin:0;

    font-size:36px;

    font-weight:900;

    letter-spacing:1px;
}

.header p{

    margin:4px 0 0;

    font-size:15px;

    color:var(--muted);
}

.subheader{

    margin-top:8px;

    font-size:14px;

    font-weight:700;

    letter-spacing:1px;

    color:#8DEBFF;

    text-transform:uppercase;
}


/* ==================================================
   BOTONES SUPERIORES
================================================== */

.acciones{

    display:flex;

    gap:10px;

    justify-content:flex-end;

    min-width:260px;
}

.btn-top{

    border:none;

    color:white;

    padding:12px 17px;

    border-radius:16px;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    background:rgba(255,255,255,.14);

    border:1px solid rgba(255,255,255,.22);

    backdrop-filter:blur(18px);

    box-shadow:
        0 10px 28px rgba(0,0,0,.25);

    transition:.25s;
}

.btn-top:hover{

    transform:translateY(-2px);

    background:rgba(255,255,255,.22);
}

.btn-rompecabezas{

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.92),
            rgba(37,99,235,.92)
        );
}

.btn-volver{

    background:
        linear-gradient(
            135deg,
            rgba(15,23,42,.8),
            rgba(51,65,85,.8)
        );
}


/* ==================================================
   ECOSISTEMA
================================================== */

.ecosistema{

    flex:1;

    margin-top:15px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    grid-template-rows:repeat(4,1fr);

    gap:13px;

    min-height:0;
}


/* ==================================================
   BOTONES DE MÓDULOS
================================================== */

.modulo{

    border:1px solid rgba(255,255,255,.25);

    color:white;

    padding:18px;

    border-radius:22px;

    font-size:24px;

    line-height:1.25;

    font-weight:900;

    letter-spacing:.3px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.08)
        ),
        linear-gradient(
            135deg,
            rgba(37,99,235,.75),
            rgba(16,185,129,.65)
        );

    backdrop-filter:blur(22px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 18px 40px rgba(0,0,0,.26);

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    min-height:95px;

    transition:.25s;
}

.modulo:hover{

    transform:
        translateY(-5px)
        scale(1.015);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.10)
        ),
        linear-gradient(
            135deg,
            rgba(124,58,237,.86),
            rgba(6,182,212,.78)
        );
}


/* ==================================================
   PANEL CENTRAL
================================================== */

.centro{

    grid-column:2 / 4;

    grid-row:2 / 4;

    border:
        1px solid rgba(255,255,255,.32);

    background:
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(30px);

    border-radius:34px;

    padding:22px 26px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;

    min-height:0;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 30px 80px rgba(0,0,0,.35);
}

.centro .badge{

    width:max-content;

    margin:0 auto 12px;

    padding:9px 16px;

    border-radius:999px;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.24);

    color:#dbeafe;

    font-weight:800;

    font-size:14px;
}

.centro h2{

    margin:0 0 12px;

    font-size:56px;

    font-weight:900;

    letter-spacing:1px;

    color:white;
}

.centro p{

    margin:0 auto;

    max-width:760px;

    font-size:18px;

    line-height:1.45;

    color:#e0f2fe;
}


/* ==================================================
   BOTÓN TEST DE MADUREZ
================================================== */

.btn-madurez{

    display:inline-block;

    margin:8px auto 14px;

    padding:14px 28px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #10b981
        );

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:800;

    letter-spacing:.5px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);

    transition:
        all .30s ease;
}

.btn-madurez:hover{

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 18px 35px rgba(0,0,0,.45);

    background:
        linear-gradient(
            135deg,
            #10b981,
            #2563eb
        );
}


/* ==================================================
   PANEL DE INFORMACIÓN
================================================== */

.panel{

    display:none;

    position:fixed;

    inset:
        105px
        26px
        24px
        26px;

    color:#0f172a;

    border-radius:30px;

    overflow:hidden;

    z-index:60;

    background:
        rgba(255,255,255,.78);

    backdrop-filter:
        blur(34px);

    border:
        1px solid rgba(255,255,255,.55);

    box-shadow:
        0 35px 90px rgba(0,0,0,.45);
}

.panel.activo{

    display:grid;

    grid-template-rows:
        76px 1fr;
}

.panel-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:
        18px 24px;

    background:
        linear-gradient(
            135deg,
            rgba(7,17,31,.92),
            rgba(37,99,235,.84)
        );

    color:white;
}

.panel-header h2{

    margin:0;

    font-size:28px;
}

.cerrar{

    background:
        rgba(239,68,68,.9);

    border:none;

    color:white;

    padding:
        10px 16px;

    border-radius:14px;

    cursor:pointer;

    font-weight:800;

    font-size:15px;
}

.panel-body{

    min-height:0;

    display:grid;

    grid-template-columns:
        300px 1fr;
}

.menu{

    min-height:0;

    overflow:auto;

    padding:18px;

    background:
        rgba(219,234,254,.65);

    border-right:
        1px solid rgba(148,163,184,.45);
}

.menu button{

    display:block;

    width:100%;

    margin-bottom:10px;

    padding:
        13px 14px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0ea5e9
        );

    color:white;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    text-align:left;

    box-shadow:
        0 8px 20px rgba(37,99,235,.25);
}

.contenido{

    min-height:0;

    padding:20px;

    overflow:hidden;
}

.descripcion-card{

    height:100%;

    overflow:auto;

    padding:24px;

    border-radius:24px;

    background:
        rgba(255,255,255,.82);

    border:
        1px solid rgba(148,163,184,.35);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85);
}

.descripcion-card h3{

    margin:0 0 14px;

    color:#1d4ed8;

    font-size:25px;
}

.descripcion-card p{

    margin:0;

    font-size:19px;

    line-height:1.62;

    text-align:justify;

    color:#1f2937;
}


/* ==================================================
   ROMPECABEZAS - MENÚ
================================================== */

.puzzle-menu{

    display:none;

    position:fixed;

    top:96px;

    right:36px;

    z-index:200;

    padding:12px;

    border-radius:20px;

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(24px);

    border:
        1px solid rgba(255,255,255,.55);

    box-shadow:
        0 25px 60px rgba(0,0,0,.35);
}

.puzzle-menu button{

    display:block;

    width:180px;

    margin:8px 0;

    padding:13px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.puzzle-menu button:hover{

    transform:translateY(-2px);

    filter:brightness(1.08);
}


/* ==================================================
   MODAL ROMPECABEZAS
================================================== */

.puzzle-modal{

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(2,6,23,.78);

    z-index:300;

    justify-content:center;

    align-items:center;

    padding:20px;
}

.puzzle-card{

    width:min(92vw,540px);

    max-height:95vh;

    overflow:auto;

    padding:24px;

    text-align:center;

    border-radius:28px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:blur(28px);

    color:#111827;

    border:
        1px solid rgba(255,255,255,.65);

    box-shadow:
        0 35px 90px rgba(0,0,0,.5);
}

.puzzle-card h2{

    margin:
        8px 0 4px;

    color:#111827;
}

#nivelTexto{

    margin:
        4px 0 8px;

    font-weight:800;

    color:#475569;
}

.cerrar-puzzle{

    float:right;

    background:#ef4444;

    color:white;

    border:none;

    padding:
        9px 14px;

    border-radius:12px;

    cursor:pointer;

    font-weight:800;
}

.cerrar-puzzle:hover{

    background:#dc2626;
}


/* ==================================================
   CRONÓMETRO
================================================== */

.cronometro-puzzle{

    margin:
        10px auto 12px;

    padding:
        10px 16px;

    width:max-content;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:20px;

    font-weight:900;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}


/* ==================================================
   TABLERO
================================================== */

.puzzle-board{

    margin:
        18px auto 0;

    display:grid;

    gap:7px;

    width:min(72vw,390px);

    height:min(72vw,390px);

    max-width:390px;

    max-height:390px;

    touch-action:manipulation;
}

.tile{

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #10b981
        );

    color:white;

    font-size:25px;

    font-weight:900;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    touch-action:manipulation;

    box-shadow:
        0 9px 18px rgba(0,0,0,.22);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.tile:hover{

    transform:scale(1.035);

    box-shadow:
        0 12px 24px rgba(0,0,0,.30);
}

.tile.empty{

    background:#e5e7eb;

    box-shadow:
        inset 0 2px 8px rgba(0,0,0,.12);

    cursor:default;

    transform:none;
}


/* ==================================================
   ORDEN DEL ECOSISTEMA
================================================== */

/* FILA SUPERIOR */

.modulo:nth-of-type(1){
    grid-column:1;
    grid-row:1;
}

.modulo:nth-of-type(2){
    grid-column:2;
    grid-row:1;
}

.modulo:nth-of-type(3){
    grid-column:3;
    grid-row:1;
}

.modulo:nth-of-type(4){
    grid-column:4;
    grid-row:1;
}


/* LADO DERECHO */

.modulo:nth-of-type(5){
    grid-column:4;
    grid-row:2;
}

.modulo:nth-of-type(6){
    grid-column:4;
    grid-row:3;
}


/* FILA INFERIOR */

.modulo:nth-of-type(7){
    grid-column:4;
    grid-row:4;
}

.modulo:nth-of-type(8){
    grid-column:3;
    grid-row:4;
}

.modulo:nth-of-type(9){
    grid-column:2;
    grid-row:4;
}

.modulo:nth-of-type(10){
    grid-column:1;
    grid-row:4;
}


/* LADO IZQUIERDO */

.modulo:nth-of-type(11){
    grid-column:1;
    grid-row:3;
}

.modulo:nth-of-type(12){
    grid-column:1;
    grid-row:2;
}


/* ==================================================
   BOTÓN ROMPECABEZAS MÓVIL
================================================== */

.btn-puzzle-mobile{

    display:none;
}


/* ==================================================
   VISTA MÓVIL
================================================== */

@media(max-width:650px){

    html,
    body{

        width:100%;

        min-height:100%;

        overflow-x:hidden;

        overflow-y:auto;
    }


    .hero{

        height:auto;

        min-height:100vh;

        padding:10px;
    }


    .topbar{

        display:none;
    }


    .btn-puzzle-mobile{

        display:flex;

        justify-content:center;

        align-items:center;

        width:100%;

        min-height:66px;

        margin-bottom:10px;

        border:none;

        border-radius:18px;

        cursor:pointer;

        color:#fff;

        font-size:18px;

        font-weight:900;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.18),
                rgba(255,255,255,.08)
            ),
            linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );

        box-shadow:
            0 18px 40px rgba(0,0,0,.25);
    }


    .ecosistema{

        display:flex;

        flex-direction:column;

        gap:10px;

        margin-top:0;
    }


    .centro{

        order:-1;

        width:100%;

        grid-column:auto;

        grid-row:auto;

        padding:
            22px 14px;

        border-radius:24px;
    }


    .centro .badge{

        width:auto;

        max-width:100%;

        font-size:12px;

        padding:
            8px 12px;
    }


    .centro h2,
    .centro h2[style]{

        font-size:34px !important;

        margin:
            0 0 8px !important;
    }


    .centro p,
    .centro p[style]{

        font-size:15px !important;

        line-height:1.4 !important;
    }


    .centro p:last-child{

        font-size:17px !important;

        font-weight:900;
    }


    .modulo{

        width:100%;

        min-height:74px;

        font-size:18px;

        border-radius:18px;

        padding:14px;
    }


    .panel{

        inset:
            10px 8px 8px 8px;

        border-radius:18px;
    }


    .panel.activo{

        grid-template-rows:
            62px 1fr;
    }


    .panel-header{

        padding:12px;
    }


    .panel-header h2{

        font-size:19px;
    }


    .panel-body{

        grid-template-columns:1fr;
    }


    .menu{

        max-height:170px;

        padding:12px;
    }


    .menu button{

        font-size:15px;

        padding:
            11px 12px;
    }


    .contenido{

        padding:12px;
    }


    .descripcion-card{

        padding:16px;
    }


    .descripcion-card p{

        font-size:16px;

        line-height:1.55;

        text-align:left;
    }


    .puzzle-menu{

        top:82px;

        left:12px;

        right:12px;

        width:auto;
    }


    .puzzle-menu button{

        width:100%;
    }


    .puzzle-card{

        width:95vw;

        padding:18px;
    }


    .puzzle-board{

        width:min(86vw,390px);

        height:min(86vw,390px);
    }


    .tile{

        font-size:21px;
    }

}

</style>

</head>


<body>


<section class="hero">


    <!-- ============================================
         BARRA SUPERIOR
    ============================================= -->

    <div class="topbar">


        <div class="brand">

            <div class="logo">
                AI
            </div>

            <span>
                Soluciones automatizadas<br>
                de Recursos Humanos
            </span>

        </div>


        <div class="header">

            <h1>
                Ecosistema automatizado + IA
            </h1>

            <p class="subheader">
                Automatización • IA • Analytics • Dashboards
            </p>

        </div>


        <div class="acciones">

            <button
                class="btn-top btn-volver"
                onclick="cerrarPanel()"
            >
                ← Volver
            </button>


            <button
                class="btn-top btn-rompecabezas"
                onclick="togglePuzzleMenu(event)"
            >
                🧩 Rompecabezas
            </button>

        </div>


    </div>


    <!-- ============================================
         BOTÓN MÓVIL
    ============================================= -->

    <button
        class="btn-puzzle-mobile"
        onclick="togglePuzzleMenu(event)"
    >
        🧩 Rompecabezas
    </button>


    <!-- ============================================
         MENÚ ROMPECABEZAS
    ============================================= -->

    <div
        class="puzzle-menu"
        id="puzzleMenu"
    >

        <button onclick="abrirPuzzle(3)">
            Nivel 3x3
        </button>

        <button onclick="abrirPuzzle(4)">
            Nivel 4x4
        </button>

        <button onclick="abrirPuzzle(5)">
            Nivel 5x5
        </button>

    </div>


    <!-- ============================================
         MODAL ROMPECABEZAS
    ============================================= -->

    <div
        class="puzzle-modal"
        id="puzzleModal"
    >

        <div
            class="puzzle-card"
            id="puzzleCard"
        >

            <button
                class="cerrar-puzzle"
                onclick="cerrarPuzzle()"
            >
                Cerrar
            </button>


            <h2>
                Rompecabezas deslizante
            </h2>


            <p id="nivelTexto"></p>


            <div class="cronometro-puzzle">

                ⏱ Tiempo:

                <span id="tiempoPuzzle">
                    00:00
                </span>

            </div>


            <div
                id="puzzleBoard"
                class="puzzle-board"
            ></div>


        </div>

    </div>


    <!-- ============================================
         ECOSISTEMA
    ============================================= -->

    <div
        class="ecosistema"
        id="botones"
    ></div>


    <!-- ============================================
         PANEL DE INFORMACIÓN
    ============================================= -->

    <div
        id="panel"
        class="panel"
    >


        <div class="panel-header">

            <h2 id="tituloModulo"></h2>

            <button
                class="cerrar"
                onclick="cerrarPanel()"
            >
                Cerrar
            </button>

        </div>


        <div class="panel-body">


            <div
                class="menu"
                id="menuModulo"
            ></div>


            <div class="contenido">


                <div class="descripcion-card">


                    <h3>
                        Descripción del módulo
                    </h3>


                    <p id="descripcionModulo"></p>


                </div>


            </div>


        </div>


    </div>


</section>


<script>


/* ==================================================
   MÓDULOS
================================================== */

let puzzleSize = 3;

let tiles = [];

let tiempoInicioPuzzle = null;

let intervaloPuzzle = null;

let puzzleEnJuego = false;


/* ==================================================
   MENÚ ROMPECABEZAS
================================================== */

function togglePuzzleMenu(event){


    if(event){
        event.stopPropagation();
    }


    const menu =
        document.getElementById("puzzleMenu");


    const estaVisible =
        window.getComputedStyle(menu).display === "block";


    menu.style.display =
        estaVisible
        ? "none"
        : "block";

}


function cerrarPuzzleMenu(){


    const menu =
        document.getElementById("puzzleMenu");


    if(menu){
        menu.style.display = "none";
    }

}


/* ==================================================
   ABRIR ROMPECABEZAS
================================================== */

function abrirPuzzle(size){


    if(
        size !== 3 &&
        size !== 4 &&
        size !== 5
    ){
        return;
    }


    puzzleSize = size;


    cerrarPuzzleMenu();


    const modal =
        document.getElementById("puzzleModal");


    modal.style.display = "flex";


    document.body.style.overflow = "hidden";


    document
        .getElementById("nivelTexto")
        .textContent =
        `Nivel ${size}x${size}`;


    /*
        Creamos primero el puzzle.
        De esta manera el cronómetro nunca
        empieza mientras se está generando.
    */

    crearPuzzle(size);


    puzzleEnJuego = true;


    reiniciarCronometroPuzzle();

}


/* ==================================================
   CERRAR ROMPECABEZAS
================================================== */

function cerrarPuzzle(){


    puzzleEnJuego = false;


    document
        .getElementById("puzzleModal")
        .style.display =
        "none";


    document.body.style.overflow = "";


    detenerCronometroPuzzle();

}


/* ==================================================
   CREAR ROMPECABEZAS

   IMPORTANTE:
   No usamos Math.random() dentro de Array.sort()
   ni usamos do...while.

   Se crea un tablero resuelto y después
   se realizan únicamente movimientos legales.

   Resultado:
   SIEMPRE TIENE SOLUCIÓN.
================================================== */

function crearPuzzle(size){


    const total =
        size * size;


    tiles = [];


    /*
        Crear puzzle resuelto:
        1,2,3...
        y espacio vacío al final.
    */

    for(
        let i = 1;
        i < total;
        i++
    ){

        tiles.push(i);

    }


    tiles.push("");


    /*
        Número de movimientos para barajar.
    */

    let movimientos = 120;


    if(size === 4){

        movimientos = 220;

    }


    if(size === 5){

        movimientos = 350;

    }


    barajarPuzzle(movimientos);


    /*
        Evitar que por casualidad quede resuelto.
    */

    if(ganaste()){


        const emptyIndex =
            tiles.indexOf("");


        const vecinos =
            obtenerVecinos(emptyIndex);


        if(vecinos.length > 0){


            const destino =
                vecinos[0];


            [
                tiles[emptyIndex],
                tiles[destino]
            ]
            =
            [
                tiles[destino],
                tiles[emptyIndex]
            ];

        }

    }


    dibujarPuzzle();

}


/* ==================================================
   OBTENER VECINOS VÁLIDOS
================================================== */

function obtenerVecinos(emptyIndex){


    const fila =
        Math.floor(
            emptyIndex / puzzleSize
        );


    const columna =
        emptyIndex % puzzleSize;


    const vecinos = [];


    /*
        ARRIBA
    */

    if(fila > 0){

        vecinos.push(
            emptyIndex - puzzleSize
        );

    }


    /*
        ABAJO
    */

    if(
        fila <
        puzzleSize - 1
    ){

        vecinos.push(
            emptyIndex + puzzleSize
        );

    }


    /*
        IZQUIERDA
    */

    if(columna > 0){

        vecinos.push(
            emptyIndex - 1
        );

    }


    /*
        DERECHA
    */

    if(
        columna <
        puzzleSize - 1
    ){

        vecinos.push(
            emptyIndex + 1
        );

    }


    return vecinos;

}


/* ==================================================
   BARAJAR

   Solo realiza movimientos que serían posibles
   durante una partida normal.
================================================== */

function barajarPuzzle(cantidadMovimientos){


    /*
        Guarda la posición anterior del vacío
        para evitar ida-vuelta constantemente.
    */

    let posicionAnteriorVacio = -1;


    for(
        let i = 0;
        i < cantidadMovimientos;
        i++
    ){


        const emptyIndex =
            tiles.indexOf("");


        let vecinos =
            obtenerVecinos(emptyIndex);


        /*
            Evitar deshacer inmediatamente
            el último movimiento.
        */

        if(
            posicionAnteriorVacio !== -1 &&
            vecinos.length > 1
        ){


            const filtrados =
                vecinos.filter(

                    indice =>
                    indice !== posicionAnteriorVacio

                );


            if(filtrados.length > 0){

                vecinos = filtrados;

            }

        }


        const aleatorio =
            Math.floor(
                Math.random() *
                vecinos.length
            );


        const destino =
            vecinos[aleatorio];


        /*
            Guardamos la ubicación actual
            del espacio vacío.
        */

        posicionAnteriorVacio =
            emptyIndex;


        /*
            Intercambiar ficha.
        */

        [
            tiles[emptyIndex],
            tiles[destino]
        ]
        =
        [
            tiles[destino],
            tiles[emptyIndex]
        ];

    }

}


/* ==================================================
   DIBUJAR TABLERO
================================================== */

function dibujarPuzzle(){


    const board =
        document.getElementById(
            "puzzleBoard"
        );


    board.innerHTML = "";


    board.style.gridTemplateColumns =
        `repeat(${puzzleSize}, 1fr)`;


    board.style.gridTemplateRows =
        `repeat(${puzzleSize}, 1fr)`;


    tiles.forEach(
        (tile,index)=>{


            const div =
                document.createElement("div");


            div.className =
                tile === ""
                ? "tile empty"
                : "tile";


            div.textContent =
                tile;


            /*
                Solo las fichas reales
                reciben evento de clic.
            */

            if(tile !== ""){


                div.addEventListener(
                    "click",
                    ()=> moverTile(index)
                );

            }


            board.appendChild(div);

        }
    );

}


/* ==================================================
   MOVER FICHA
================================================== */

function moverTile(index){


    if(!puzzleEnJuego){

        return;

    }


    const emptyIndex =
        tiles.indexOf("");


    /*
        Evitar operaciones si por alguna razón
        no existe espacio vacío.
    */

    if(emptyIndex === -1){

        return;

    }


    const fila =
        Math.floor(
            index / puzzleSize
        );


    const columna =
        index % puzzleSize;


    const emptyFila =
        Math.floor(
            emptyIndex / puzzleSize
        );


    const emptyColumna =
        emptyIndex % puzzleSize;


    /*
        Una ficha es válida si está
        exactamente a una posición del vacío.
    */

    const distancia =

        Math.abs(
            fila - emptyFila
        )

        +

        Math.abs(
            columna - emptyColumna
        );


    if(distancia !== 1){

        return;

    }


    /*
        Intercambiar ficha.
    */

    [
        tiles[index],
        tiles[emptyIndex]
    ]
    =
    [
        tiles[emptyIndex],
        tiles[index]
    ];


    dibujarPuzzle();


    /*
        Comprobar victoria.
    */

    if(ganaste()){


        puzzleEnJuego = false;


        detenerCronometroPuzzle();


        const tiempoFinal =

            document
            .getElementById(
                "tiempoPuzzle"
            )
            .textContent;


        /*
            Pequeño retraso para permitir
            que se dibuje el último movimiento.
        */

        setTimeout(
            ()=>{


                alert(
                    `¡Ganaste! Tiempo de solución: ${tiempoFinal} 🧩`
                );


            },
            120
        );

    }

}


/* ==================================================
   COMPROBAR VICTORIA
================================================== */

function ganaste(){


    const total =
        puzzleSize *
        puzzleSize;


    /*
        Comprobar números.
    */

    for(
        let i = 0;
        i < total - 1;
        i++
    ){


        if(
            tiles[i] !==
            i + 1
        ){

            return false;

        }

    }


    /*
        Último espacio debe estar vacío.
    */

    return (
        tiles[total - 1] === ""
    );

}


/* ==================================================
   CRONÓMETRO
================================================== */

function reiniciarCronometroPuzzle(){


    detenerCronometroPuzzle();


    tiempoInicioPuzzle =
        Date.now();


    document
        .getElementById(
            "tiempoPuzzle"
        )
        .textContent =
        "00:00";


    intervaloPuzzle =
        window.setInterval(
            ()=>{


                /*
                    Si el juego no está activo
                    no hacemos cálculos.
                */

                if(!puzzleEnJuego){

                    return;

                }


                const ahora =
                    Date.now();


                const segundosTotales =
                    Math.floor(
                        (
                            ahora -
                            tiempoInicioPuzzle
                        )
                        /
                        1000
                    );


                const minutos =
                    Math.floor(
                        segundosTotales /
                        60
                    );


                const segundos =
                    segundosTotales %
                    60;


                document
                    .getElementById(
                        "tiempoPuzzle"
                    )
                    .textContent =

                    String(minutos)
                    .padStart(
                        2,
                        "0"
                    )

                    +

                    ":"

                    +

                    String(segundos)
                    .padStart(
                        2,
                        "0"
                    );


            },
            1000
        );

}


/* ==================================================
   DETENER CRONÓMETRO
================================================== */

function detenerCronometroPuzzle(){


    if(
        intervaloPuzzle !== null
    ){


        clearInterval(
            intervaloPuzzle
        );


        intervaloPuzzle =
            null;

    }

}
