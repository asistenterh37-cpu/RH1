<body>

<div class="app">

<script>

/* ============================================================
   CONFIGURACION
   ============================================================ */

const CONFIG = {

  /*
   * Pega aquí la URL de implementación
   * de Apps Script terminada en /exec.
   */

  GAS_WEB_APP_URL:
    'https://script.google.com/macros/s/AKfycbxmhXdT2rZVVP_iRi1xu3ttVeRxjecJDLSM8jZHH4PElMKqK86_xEstJGGXXx0Pks7g/exec'

};


/* ============================================================
   ESTADO
   ============================================================ */

let MENU = [];

let currentBusiness =
  '';

let currentCategory =
  '';

let accountLines =
  [];

let editingLine =
  -1;

let accountClosed =
  false;

let loading =
  false;


/* ============================================================
   INICIO
   ============================================================ */

document.addEventListener(
  'DOMContentLoaded',
  () => {

    document
      .getElementById(
        'businessSelect'
      )
      .addEventListener(
        'change',
        changeBusiness
      );


    document
      .getElementById(
        'searchInput'
      )
      .addEventListener(
        'input',
        renderItems
      );


    renderReceipt();

    loadMenu();

  }
);


/* ============================================================
   CARGAR / RECARGAR
   ============================================================ */

function reloadMenu(){

  loadMenu(
    true
  );

}



/* ============================================================
   VALIDAR CONFIGURACION
   ============================================================ */

function assertConfigured(){

  if(
    !CONFIG.GAS_WEB_APP_URL
    ||
    CONFIG.GAS_WEB_APP_URL.includes(
      'PEGA_AQUI'
    )
  ){

    throw new Error(
      'Debes pegar la URL /exec de Apps Script en GAS_WEB_APP_URL.'
    );

  }

}



/* ============================================================
   JSONP
   Evita problemas CORS entre GitHub y Apps Script.
   ============================================================ */

function jsonp(
  action,
  params = {},
  timeoutMs = 15000
){

  assertConfigured();


  return new Promise(
    (
      resolve,
      reject
    ) => {


      const callback =
        'cajaCallback_'
        +
        Date.now()
        +
        '_'
        +
        Math.random()
          .toString(36)
          .slice(2);


      const url =
        new URL(
          CONFIG.GAS_WEB_APP_URL
        );


      url.searchParams.set(
        'action',
        action
      );


      url.searchParams.set(
        'callback',
        callback
      );


      url.searchParams.set(
        '_',
        Date.now()
      );


      Object
        .entries(
          params
        )
        .forEach(
          ([key,value]) => {

            if(
              value !==
              undefined
              &&
              value !==
              null
            ){

              url
                .searchParams
                .set(
                  key,
                  value
                );

            }

          }
        );


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timer =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'Tiempo de espera agotado al conectar con Apps Script.'
              )
            );

          },
          timeoutMs
        );


      function cleanup(){

        if(
          finished
        ){
          return;
        }


        finished =
          true;


        clearTimeout(
          timer
        );


        try{

          delete window[
            callback
          ];

        }
        catch(_){
        }


        script.remove();

      }


      window[
        callback
      ] =
        data => {

          if(
            finished
          ){
            return;
          }


          const result =
            data;


          cleanup();

          resolve(
            result
          );

        };


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              'No fue posible comunicarse con Apps Script.'
            )
          );

        };


      script.src =
        url.toString();


      document
        .head
        .appendChild(
          script
        );

    }
  );

}



/* ============================================================
   CARGAR HOJA MENU
   ============================================================ */

async function loadMenu(
  force = false
){

  if(
    loading
  ){
    return;
  }


  loading =
    true;


  setStatus(
    'Cargando hoja Menu...'
  );


  document
    .getElementById(
      'itemsGrid'
    )
    .innerHTML =
      `
      <div class="loader">
        Cargando menú...
      </div>
      `;


  try{

    const response =
      await jsonp(
        'menu',
        {
          force:
            force
            ?
            '1'
            :
            '0'
        }
      );


    if(
      !response
      ||
      response.ok !==
      true
    ){

      throw new Error(
        (
          response
          &&
          response.error
        )
        ||
        'Apps Script no devolvió un menú válido.'
      );

    }


    MENU =
      Array.isArray(
        response.items
      )
      ?
      response.items
      :
      [];


    if(
      !MENU.length
    ){

      throw new Error(
        'La hoja Menu no contiene registros válidos.'
      );

    }


    renderBusinesses();


    setStatus(
      MENU.length
      +
      ' ítems cargados correctamente.'
    );

  }
  catch(error){

    console.error(
      error
    );


    setStatus(
      error.message
      ||
      'Error cargando el menú.',
      true
    );


    document
      .getElementById(
        'itemsGrid'
      )
      .innerHTML =
        `
        <div class="loader">
          ⚠️ ${escapeHtml(
            error.message
            ||
            'No fue posible cargar el menú.'
          )}
        </div>
        `;

  }
  finally{

    loading =
      false;

  }

}



/* ============================================================
   NEGOCIOS
   ============================================================ */

function getBusinesses(){

  return [
    ...new Set(
      MENU
        .map(
          x =>
            String(
              x.negocio
              ??
              ''
            )
            .trim()
        )
        .filter(
          Boolean
        )
    )
  ];

}



function renderBusinesses(){

  const select =
    document.getElementById(
      'businessSelect'
    );


  const businesses =
    getBusinesses();


  select.innerHTML =
    businesses
      .map(
        name =>
          `
          <option value="${escapeAttr(name)}">
            ${escapeHtml(name)}
          </option>
          `
      )
      .join('');


  select.disabled =
    false;


  if(
    !businesses.length
  ){
    return;
  }


  if(
    !businesses.includes(
      currentBusiness
    )
  ){

    currentBusiness =
      businesses[0];

  }


  select.value =
    currentBusiness;


  document
    .getElementById(
      'screenBusiness'
    )
    .textContent =
      currentBusiness;


  renderCategories();

}



/* ============================================================
   CAMBIAR NEGOCIO
   ============================================================ */

function changeBusiness(
  event
){

  const next =
    String(
      event.target.value
      ||
      ''
    )
    .trim();


  if(
    !next
    ||
    next ===
    currentBusiness
  ){
    return;
  }


  /*
   * Cada negocio utiliza su propia cuenta.
   * Al cambiar de negocio se limpia la actual.
   */

  currentBusiness =
    next;


  newAccount(
    false
  );


  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';


  document
    .getElementById(
      'screenBusiness'
    )
    .textContent =
      currentBusiness;


  renderCategories();

}



/* ============================================================
   CATEGORIAS
   ============================================================ */

function getCategories(){

  return [
    ...new Set(
      MENU
        .filter(
          x =>
            x.negocio ===
            currentBusiness
        )
        .map(
          x =>
            String(
              x.categoria
              ??
              ''
            )
            .trim()
        )
        .filter(
          Boolean
        )
    )
  ];

}



function renderCategories(){

  const categories =
    getCategories();


  if(
    !categories.includes(
      currentCategory
    )
  ){

    currentCategory =
      categories[0]
      ||
      '';

  }


  const bar =
    document.getElementById(
      'categoryBar'
    );


  bar.innerHTML =
    categories
      .map(
        category =>
          `
          <button
            type="button"
            class="
              category-btn
              ${
                category ===
                currentCategory
                ?
                'on'
                :
                ''
              }
            "
            data-category="${escapeAttr(category)}"
          >
            ${escapeHtml(category)}
          </button>
          `
      )
      .join('');


  bar
    .querySelectorAll(
      '[data-category]'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            currentCategory =
              button.dataset.category;


            renderCategories();

          }
        );

      }
    );


  document
    .getElementById(
      'categoryInfo'
    )
    .textContent =
      categories.length
      +
      (
        categories.length ===
        1
        ?
        ' categoría'
        :
        ' categorías'
      );


  renderItems();

}



/* ============================================================
   ITEMS
   ============================================================ */

function renderItems(){

  const grid =
    document.getElementById(
      'itemsGrid'
    );


  const query =
    normalizeText(
      document
        .getElementById(
          'searchInput'
        )
        .value
    );


  let items =
    MENU
      .filter(
        x =>
          x.negocio ===
          currentBusiness
      );


  /*
   * Si hay búsqueda,
   * busca en todas las categorías
   * del negocio.
   */

  if(query){

    items =
      items.filter(
        x => {

          const text =
            normalizeText(
              (
                x.item
                ||
                ''
              )
              +
              ' '
              +
              (
                x.categoria
                ||
                ''
              )
            );


          return text.includes(
            query
          );

        }
      );

  }

  /*
   * Sin búsqueda solo muestra
   * la categoría seleccionada.
   */

  else{

    items =
      items.filter(
        x =>
          x.categoria ===
          currentCategory
      );

  }


  if(
    !items.length
  ){

    grid.innerHTML =
      `
      <div class="loader">
        No hay ítems para mostrar.
      </div>
      `;

    return;

  }


  grid.innerHTML =
    items
      .map(
        item => {


          const line =
            accountLines.find(
              x =>
                x.id ===
                item.id
            );


          const count =
            line
            ?
            Number(
              line.cantidad
            )
            :
            0;


          return `
            <button
              type="button"
              class="
                item-btn
                ${
                  count
                  ?
                  'selected'
                  :
                  ''
                }
              "
              data-item-id="${escapeAttr(item.id)}"
            >

              <span class="item-name">

                ${escapeHtml(
                  item.item
                )}

              </span>


              <span class="item-bottom">

                <span class="item-price">

                  ${money(
                    item.valor
                  )}

                </span>


                ${
                  count

                  ?

                  `
                  <span class="item-count">
                    ${count}
                  </span>
                  `

                  :

                  ''
                }

              </span>

            </button>
          `;

        }
      )
      .join('');


  grid
    .querySelectorAll(
      '[data-item-id]'
    )
    .forEach(
      button => {

        button.addEventListener(
          'click',
          () => {

            addItem(
              button.dataset.itemId
            );

          }
        );

      }
    );

}



/* ============================================================
   AGREGAR ITEM
   ============================================================ */

function addItem(
  id
){

  if(
    accountClosed
  ){

    setStatus(
      'La cuenta está cerrada. Presiona C para abrir una nueva cuenta.'
    );

    return;

  }


  const item =
    MENU.find(
      x =>
        x.id ===
        id
    );


  if(
    !item
  ){
    return;
  }


  let line =
    accountLines.find(
      x =>
        x.id ===
        id
    );


  if(line){

    line.cantidad =
      Math.min(
        999,
        Number(
          line.cantidad
        )
        +
        1
      );

  }

  else{

    accountLines.push({

      id:
        item.id,

      negocio:
        item.negocio,

      categoria:
        item.categoria,

      item:
        item.item,

      valor:
        Number(
          item.valor
        )
        ||
        0,

      cantidad:
        1

    });

  }


  renderReceipt();

  renderItems();


  setStatus(
    item.item
    +
    ' agregado.'
  );

}



/* ============================================================
   TOTAL
   ============================================================ */

function accountTotal(){

  return accountLines
    .reduce(
      (
        total,
        line
      ) =>
        total
        +
        (
          Number(
            line.cantidad
          )
          *
          Number(
            line.valor
          )
        ),
      0
    );

}



/* ============================================================
   DETALLE
   ============================================================ */

function renderReceipt(){

  const receipt =
    document.getElementById(
      'receipt'
    );


  const total =
    document.getElementById(
      'grandTotal'
    );


  const state =
    document.getElementById(
      'accountState'
    );


  if(
    !accountLines.length
  ){

    receipt.innerHTML =
      `
      <div class="empty-receipt">
        Toca un ítem para iniciar la cuenta.
      </div>
      `;

  }

  else{

    receipt.innerHTML =
      accountLines
        .map(
          (
            line,
            index
          ) => {


            const subtotal =
              Number(
                line.cantidad
              )
              *
              Number(
                line.valor
              );


            const editing =
              editingLine ===
              index;


            return `
              <div
                class="
                  receipt-line
                  ${
                    editing
                    ?
                    'editing'
                    :
                    ''
                  }
                "
              >

                <button
                  type="button"
                  class="receipt-main"
                  onclick="toggleLine(${index})"
                >

                  <span class="line-qty">
                    ${line.cantidad}×
                  </span>

                  <span
                    class="line-name"
                    title="${escapeAttr(line.item)}"
                  >
                    ${escapeHtml(line.item)}
                  </span>

                  <span class="line-total">
                    ${money(subtotal)}
                  </span>

                </button>


                ${
                  editing

                  ?

                  `
                  <div class="line-editor">

                    <button
                      type="button"
                      onclick="changeQty(${index},-1)"
                      ${
                        Number(
                          line.cantidad
                        )
                        <=
                        1
                        ?
                        'disabled'
                        :
                        ''
                      }
                    >
                      −
                    </button>

                    <span class="line-count">
                      ${line.cantidad}
                    </span>

                    <button
                      type="button"
                      onclick="changeQty(${index},1)"
                    >
                      +
                    </button>

                    <button
                      type="button"
                      class="delete"
                      onclick="deleteLine(${index})"
                    >
                      🗑
                    </button>

                  </div>
                  `

                  :

                  ''
                }

              </div>
            `;

          }
        )
        .join('');

  }


  total.textContent =
    money(
      accountTotal()
    );


  state.textContent =
    accountClosed
    ?
    'TOTAL FINAL'
    :
    'TOTAL ACTUAL';


  requestAnimationFrame(
    () => {

      receipt.scrollTop =
        receipt.scrollHeight;

    }
  );

}



/* ============================================================
   EDITAR LINEA
   ============================================================ */

function toggleLine(
  index
){

  editingLine =
    editingLine ===
    index
    ?
    -1
    :
    index;


  renderReceipt();

}



/* ============================================================
   CAMBIAR CANTIDAD
   ============================================================ */

function changeQty(
  index,
  delta
){

  const line =
    accountLines[
      index
    ];


  if(
    !line
  ){
    return;
  }


  if(
    accountClosed
  ){

    accountClosed =
      false;

  }


  const next =
    Number(
      line.cantidad
    )
    +
    Number(
      delta
      ||
      0
    );


  if(
    next < 1
  ){
    return;
  }


  line.cantidad =
    Math.min(
      999,
      next
    );


  editingLine =
    index;


  renderReceipt();

  renderItems();

}



/* ============================================================
   ELIMINAR LINEA
   ============================================================ */

function deleteLine(
  index
){

  if(
    !accountLines[
      index
    ]
  ){
    return;
  }


  if(
    accountClosed
  ){

    accountClosed =
      false;

  }


  const name =
    accountLines[
      index
    ].item;


  accountLines.splice(
    index,
    1
  );


  editingLine =
    -1;


  renderReceipt();

  renderItems();


  setStatus(
    name
    +
    ' eliminado.'
  );

}



/* ============================================================
   =
   ============================================================ */

function closeAccount(){

  if(
    !accountLines.length
  ){

    setStatus(
      'No hay ítems para totalizar.'
    );

    return;

  }


  accountClosed =
    true;

  editingLine =
    -1;


  renderReceipt();

  renderItems();


  setStatus(
    'Total final: '
    +
    money(
      accountTotal()
    )
  );

}



/* ============================================================
   C
   ============================================================ */

function newAccount(
  showMessage = true
){

  accountLines =
    [];

  editingLine =
    -1;

  accountClosed =
    false;


  renderReceipt();

  renderItems();


  if(
    showMessage
  ){

    setStatus(
      'Nueva cuenta abierta.'
    );

  }

}



/* ============================================================
   ESTADO
   ============================================================ */

function setStatus(
  message,
  error = false
){

  const el =
    document.getElementById(
      'status'
    );


  el.textContent =
    message;


  el.classList.toggle(
    'error',
    error
  );

}



/* ============================================================
   MONEDA
   ============================================================ */

function money(
  value
){

  const n =
    Number(
      value
    )
    ||
    0;


  return 'L '
    +
    n.toLocaleString(
      'es-HN',
      {
        minimumFractionDigits:
          2,

        maximumFractionDigits:
          2
      }
    );

}



/* ============================================================
   NORMALIZAR
   ============================================================ */

function normalizeText(
  value
){

  return String(
    value
    ??
    ''
  )
  .normalize(
    'NFD'
  )
  .replace(
    /[\u0300-\u036f]/g,
    ''
  )
  .toLowerCase()
  .trim();

}



/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escapeHtml(
  value
){

  return String(
    value
    ??
    ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}



function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}

</script>

</body>
</html>
