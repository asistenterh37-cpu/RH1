<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIGÍA ALERTAS</title><style>body{margin:0;padding:20px;background:#101b2b;color:#eef6ff;font:17px system-ui;min-height:90vh;display:grid;place-items:center}main{background:#23364e;border-radius:16px;padding:28px;max-width:510px}a{display:block;background:#35b7a9;color:#082626;padding:15px;text-align:center;text-decoration:none;font-weight:bold;border-radius:9px}.note{color:#d5e2ed;line-height:1.5}</style><main><h1>🔔 VIGÍA ALERTAS</h1><p>Acceso exclusivo a eventos de seguridad. Sin video ni cámaras.</p><a id="enter" href="#">Ingresar con nombre y PIN</a><p id="msg" class="note"></p></main><script>
